# ============================================================================
# OneRecycle 生产环境 Docker Compose 配置 (微服务架构)
# 适配 4核 8G 服务器
# ============================================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-one_recycle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-one_recycle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-one_recycle}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      sh -c '
        redis-server 
        --requirepass "$${REDIS_PASSWORD}" 
        --appendonly yes 
        --maxmemory 256mb 
        --maxmemory-policy allkeys-lru
      '
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "sh", "-c", 'redis-cli -a "$${REDIS_PASSWORD}" ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # API Gateway - 统一入口
  api-gateway:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - PORT=3002
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 账户服务
  account-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-account-service
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=account-service
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # 订单服务
  order-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-order-service
    restart: always
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=order-service
      - PORT=3003
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3003/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # 通知服务
  notification-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-notification-service
    restart: always
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=notification-service
      - PORT=3004
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3004/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 库存服务
  inventory-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-inventory-service
    restart: always
    ports:
      - "127.0.0.1:3009:3009"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=inventory-service
      - PORT=3009
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3009/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 分类服务
  category-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-category-service
    restart: always
    ports:
      - "127.0.0.1:3008:3008"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=category-service
      - PORT=3008
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3008/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # Admin Web
  admin-web:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-backbuy.cn}
      - PORT=3000
    depends_on:
      - api-gateway
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: one-recycle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../ssl:/etc/nginx/ssl:ro
      - ../certbot-webroot:/var/www/certbot:ro
    networks:
      - one-recycle-network
    depends_on:
      - api-gateway
      - admin-web
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # Certbot SSL 证书管理
  certbot:
    image: certbot/certbot:latest
    container_name: one-recycle-certbot
    restart: always
    volumes:
      - ../ssl:/etc/letsencrypt
      - ../certbot-webroot:/var/www/certbot
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    networks:
      - one-recycle-network
    command: >
      sh -c "
        trap 'exit 0' TERM INT
        while true; do
          if [ -d /etc/letsencrypt/live/$${DOMAIN} ]; then
            certbot renew --webroot -w /var/www/certbot --quiet 2>/dev/null || true
          else
            certbot certonly --webroot -w /var/www/certbot
            -d $${DOMAIN} -d www.$${DOMAIN} -d api.$${DOMAIN} -d admin.$${DOMAIN}
            --email $${EMAIL} --agree-tos --no-eff-email --non-interactive 2>/dev/null || true
          fi
          sleep 12h
        done
      "

volumes:
  postgres_data:
  redis_data:


networks:
  one-recycle-network:
    driver: bridge
