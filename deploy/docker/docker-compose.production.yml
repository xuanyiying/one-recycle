# ============================================================================
# OneRecycle 生产环境 Docker Compose 配置 (微服务架构)
# 每个微服务通过 SERVICE_NAME 环境变量启动不同模式
# 镜像统一, 入口通过 SERVICE_NAME 区分
# ============================================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-one_recycle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-one_recycle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-one_recycle}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # API Gateway - 统一 HTTP 入口
  api-gateway:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - PORT=3002
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OSS_TYPE=${OSS_TYPE:-TENCENT_COS}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-}
      - OSS_BUCKET=${OSS_BUCKET:-one-recycle}
      - OSS_REGION=${OSS_REGION:-ap-guangzhou}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_SECURE=${OSS_SECURE:-true}
      - JWT_SECRET=${JWT_SECRET:-OneRecycle2025Secure}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3002/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 账户服务 (gRPC)
  account-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-account-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=account-service
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-OneRecycle2025Secure}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # 订单服务 (gRPC)
  order-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-order-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=order-service
      - PORT=3003
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OSS_TYPE=${OSS_TYPE:-TENCENT_COS}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-}
      - OSS_BUCKET=${OSS_BUCKET:-one-recycle}
      - OSS_REGION=${OSS_REGION:-ap-guangzhou}
      - JWT_SECRET=${JWT_SECRET:-OneRecycle2025Secure}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13003/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # 通知服务 (gRPC)
  notification-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-notification-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=notification-service
      - PORT=3004
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-OneRecycle2025Secure}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13004/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 库存服务 (gRPC)
  inventory-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-inventory-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=inventory-service
      - PORT=3009
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-OneRecycle2025Secure}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13009/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 分类服务 (gRPC)
  category-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-category-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=category-service
      - PORT=3008
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-OneRecycle2025Secure}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13008/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # Admin Web
  admin-web:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-backbuy.cn}
      - PORT=3000
    depends_on:
      - api-gateway
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok || r.status === 404 ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # Nginx 反向代理
  # 使用官方 nginx:alpine 镜像 + volume 挂载配置，无需自定义构建
  # 入口脚本自动处理 SSL 证书生成和 HTTPS 配置
  nginx:
    image: nginx:alpine
    container_name: one-recycle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/https.conf.template:/tmp/https.conf.template:ro
      - ../nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ../ssl:/etc/nginx/ssl
      - ../certbot-webroot:/var/www/certbot:ro
      - ../www/html:/var/www/html:ro
    environment:
      - DOMAIN=${DOMAIN:-backbuy.cn}
    networks:
      - one-recycle-network
    depends_on:
      - api-gateway
      - admin-web
    entrypoint: [ "/bin/sh", "/nginx-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # Certbot SSL 证书管理
  # 通过 webroot 方式验证域名，需要 nginx 先启动（HTTP 80 可用）
  # 首次部署：nginx 用自签名证书启动 → certbot 申请正式证书 → nginx reload
  certbot:
    image: certbot/certbot:latest
    container_name: one-recycle-certbot
    restart: always
    volumes:
      - ../ssl:/etc/letsencrypt
      - ../certbot-webroot:/var/www/certbot
    environment:
      - DOMAIN=${DOMAIN:-backbuy.cn}
      - EMAIL=${EMAIL}
    networks:
      - one-recycle-network
    depends_on:
      nginx:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap 'exit 0' TERM INT
        while true; do
          DOMAIN_NAME="$${DOMAIN:-backbuy.cn}"
          CERT_PATH="/etc/letsencrypt/live/$${DOMAIN_NAME}"
          if [ -d "$$CERT_PATH" ] && [ -f "$$CERT_PATH/fullchain.pem" ] && [ -f "$$CERT_PATH/privkey.pem" ]; then
            echo "[$(date)] Renewing certificate for $${DOMAIN_NAME}..."
            certbot renew --webroot -w /var/www/certbot --quiet 2>&1 || echo "[$(date)] Renewal failed, will retry in 12h"
          else
            echo "[$(date)] Requesting initial certificate for $${DOMAIN_NAME}..."
            certbot certonly --webroot -w /var/www/certbot \
              -d "$$DOMAIN_NAME" -d "www.$$DOMAIN_NAME" -d "api.$$DOMAIN_NAME" -d "admin.$$DOMAIN_NAME" \
              --email "$$EMAIL" --agree-tos --no-eff-email --non-interactive 2>&1 || echo "[$(date)] Certificate request failed, will retry in 12h"
          fi
          sleep 12h
        done

volumes:
  postgres_data:
  redis_data:


networks:
  one-recycle-network:
    driver: bridge
