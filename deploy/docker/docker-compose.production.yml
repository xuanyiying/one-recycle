# ============================================================================
# OneRecycle 生产环境 Docker Compose 配置 (微服务架构)
# 每个微服务通过 SERVICE_NAME 环境变量启动不同模式
# 镜像统一, 入口通过 SERVICE_NAME 区分
# ============================================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-one_recycle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-one_recycle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-one_recycle}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # API Gateway - 统一 HTTP 入口
  api-gateway:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - RUN_SEED=1
      - PORT=3002
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OSS_TYPE=${OSS_TYPE:-TENCENT_COS}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-}
      - OSS_BUCKET=${OSS_BUCKET:-one-recycle}
      - OSS_REGION=${OSS_REGION:-ap-guangzhou}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_SECURE=${OSS_SECURE:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3002/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 账户服务 (gRPC)
  account-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-account-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=account-service
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # 订单服务 (gRPC)
  order-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-order-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=order-service
      - PORT=3003
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OSS_TYPE=${OSS_TYPE:-TENCENT_COS}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-}
      - OSS_BUCKET=${OSS_BUCKET:-one-recycle}
      - OSS_REGION=${OSS_REGION:-ap-guangzhou}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13003/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # 通知服务 (gRPC)
  notification-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-notification-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=notification-service
      - PORT=3004
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13004/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 库存服务 (gRPC)
  inventory-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-inventory-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=inventory-service
      - PORT=3009
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13009/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # 分类服务 (gRPC)
  category-service:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-category-service
    restart: always
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=category-service
      - PORT=3008
      - DATABASE_URL=postgresql://${DB_USERNAME:-one_recycle}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-one_recycle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13008/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # Admin Web
  admin-web:
    image: ${REGISTRY:-ghcr.io/xuanyiying/one-recycle}/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    environment:
      - NODE_ENV=production
      # API URL: uses main domain /api path for admin-web to call API gateway
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-backbuy.cn}/api
      - PORT=3000
    depends_on:
      - api-gateway
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok || r.status === 404 ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # Caddy 统一入口（自动 HTTPS + 反向代理）
  caddy:
    image: caddy:2-alpine
    container_name: one-recycle-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../www/html:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - one-recycle-network
    depends_on:
      - api-gateway
      - admin-web
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  one-recycle-network:
    driver: bridge
