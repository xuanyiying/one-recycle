# ============================================================================
# OneRecycle 生产环境 Docker Compose 配置 (微服务架构)
# 每个微服务通过 SERVICE_NAME 环境变量启动不同模式
# 镜像统一, 入口通过 SERVICE_NAME 区分
# 镜像由 CI 流水线构建并推送至 CNB Registry，服务器端拉取运行
# .env 文件由 deploy workflow 覆盖为实际值，确保容器运行时获得正确配置
# 支持 HTTP REST + gRPC 双协议通信
# ============================================================================

services:
  # ──────────────────────────────────────────────────────────────
  # 基础设施: 数据库 & 缓存
  # ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-one_recycle}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-one_recycle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-one_recycle}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 192mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ──────────────────────────────────────────────────────────────
  # API 网关服务 (HTTP 入口)
  # ──────────────────────────────────────────────────────────────

  api-gateway:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - RUN_SEED=1
      - PORT=3002
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3002/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ──────────────────────────────────────────────────────────────
  # 核心业务微服务 (HTTP + gRPC 双协议)
  # ──────────────────────────────────────────────────────────────

  account-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-account-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=account-service
      - PORT=3001
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  order-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-order-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=order-service
      - PORT=3003
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13003/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  payment-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-payment-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=payment-service
      - PORT=3005
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13005/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  dispatch-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-dispatch-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=dispatch-service
      - PORT=3006
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13006/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  notification-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-notification-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=notification-service
      - PORT=3004
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13004/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  inventory-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-inventory-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=inventory-service
      - PORT=3009
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13009/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  category-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-category-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=category-service
      - PORT=3008
      - SERVICE_MODE=microservices
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13008/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # ──────────────────────────────────────────────────────────────
  # 队列处理服务 (消费 Bull Queue，通过 gRPC 调用其他微服务)
  # ──────────────────────────────────────────────────────────────

  queue-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-queue-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=queue-service
      - PORT=3007
      - SERVICE_MODE=microservices
      # gRPC 服务地址 (Docker 内部网络使用容器名)
      - ORDER_SERVICE_GRPC_URL=order-service:50051
      - PAYMENT_SERVICE_GRPC_URL=payment-service:50051
      - INVENTORY_SERVICE_GRPC_URL=inventory-service:50051
      - DISPATCH_SERVICE_GRPC_URL=dispatch-service:50051
      - NOTIFICATION_SERVICE_GRPC_URL=notification-service:50051
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:13007/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M

  # ──────────────────────────────────────────────────────────────
  # 前端应用 (Admin Dashboard)
  # ──────────────────────────────────────────────────────────────

  admin-web:
    image: docker.cnb.cool/udefined.cc/one-recycle/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - API_BACKEND_URL=http://api-gateway:3002
      - PORT=3000
    depends_on:
      - api-gateway
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok || r.status === 404 ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  # ──────────────────────────────────────────────────────────────
  # 反向代理 (Caddy) - HTTPS 终结 + 静态文件
  # ──────────────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    container_name: one-recycle-caddy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../www/html:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - one-recycle-network
    depends_on:
      - api-gateway
      - admin-web
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  one-recycle-network:
    driver: bridge
