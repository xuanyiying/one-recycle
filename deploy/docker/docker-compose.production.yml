# ============================================================================
# OneRecycle 生产环境 Docker Compose 配置
# 自建数据库和Redis版本（推荐初创项目使用）
# ============================================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-one_recycle}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-one_recycle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-one_recycle}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway - 统一入口
  api-gateway:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: one-recycle-api-gateway
    restart: always
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - PORT=3002
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 账户服务
  account-service:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: one-recycle-account-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=account-service
      - PORT=3001
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 订单服务
  order-service:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: one-recycle-order-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=order-service
      - PORT=3003
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 通知服务
  notification-service:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: one-recycle-notification-service
    restart: always
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=notification-service
      - PORT=3004
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 库存服务
  inventory-service:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: one-recycle-inventory-service
    restart: always
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=inventory-service
      - PORT=3009
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 分类服务
  category-service:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: one-recycle-category-service
    restart: always
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=category-service
      - PORT=3008
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 消息队列服务
  message-queue:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: one-recycle-message-queue
    restart: always
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=message-queue
      - PORT=3010
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: one-recycle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - one-recycle-network
    depends_on:
      - api-gateway
      - account-service
      - order-service

  # Ollama 本地 AI 模型服务
  ollama:
    image: ollama/ollama:latest
    container_name: one-recycle-ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - one-recycle-network
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  ollama_models:

networks:
  one-recycle-network:
    driver: bridge
