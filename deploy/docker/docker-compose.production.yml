# ============================================================================
# OneRecycle 生产环境 Docker Compose 配置 (微服务架构)
# 每个微服务通过 SERVICE_NAME 环境变量启动不同模式
# 镜像统一, 入口通过 SERVICE_NAME 区分
# 镜像由 CI 流水线构建并推送至 CNB Registry，服务器端拉取运行
# .env 文件由 deploy workflow 覆盖为实际值，确保容器运行时获得正确配置
# ============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-one_recycle}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-one_recycle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-one_recycle}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 192mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api-gateway:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - RUN_SEED=1
      - PORT=3002
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3002/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  account-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-account-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=account-service
      - PORT=3001
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  order-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-order-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=order-service
      - PORT=3003
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3003/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  notification-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-notification-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=notification-service
      - PORT=3004
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3004/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  inventory-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-inventory-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=inventory-service
      - PORT=3009
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3009/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  category-service:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-category-service
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=category-service
      - PORT=3008
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3008/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  admin-web:
    image: docker.cnb.cool/udefined.cc/one-recycle/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - API_BACKEND_URL=http://api-gateway:3002
      - PORT=3000
    depends_on:
      - api-gateway
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok || r.status === 404 ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 384M

  caddy:
    image: caddy:2-alpine
    container_name: one-recycle-caddy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../www/html:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - one-recycle-network
    depends_on:
      - api-gateway
      - admin-web
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  one-recycle-network:
    driver: bridge
