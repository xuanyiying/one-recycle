user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    upstream backend {
        least_conn;
        server api-gateway:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream admin_web {
        least_conn;
        server admin-web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # =========================================================================
    # HTTP → HTTPS 重定向
    # =========================================================================

    # www.backbuy.cn → backbuy.cn (HTTPS)
    server {
        listen 80;
        server_name www.backbuy.cn;
        return 301 https://backbuy.cn$request_uri;
    }

    # backbuy.cn HTTP → HTTPS
    server {
        listen 80 default_server;
        server_name backbuy.cn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://backbuy.cn$request_uri;
        }
    }

    # api.backbuy.cn HTTP → HTTPS
    server {
        listen 80;
        server_name api.backbuy.cn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://api.backbuy.cn$request_uri;
        }
    }

    # admin.backbuy.cn HTTP → HTTPS
    server {
        listen 80;
        server_name admin.backbuy.cn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://admin.backbuy.cn$request_uri;
        }
    }

    include /etc/nginx/conf.d/https.conf;
}
