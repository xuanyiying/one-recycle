services:
  # Certbot SSL 证书管理
  # 通过 DNS-01 验证方式申请通配符证书 (*.backbuy.cn)
  # 使用腾讯云 DNSPod API 自动添加/删除 TXT 记录
  certbot:
    image: certbot/certbot:latest
    container_name: one-recycle-certbot
    restart: always
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot:ro
      - ./certbot/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
      - ./certbot/certbot-auth-hook.sh:/certbot-auth-hook.sh:ro
      - ./certbot/certbot-cleanup-hook.sh:/certbot-cleanup-hook.sh:ro
      - ./certbot/dnspod_client.py:/certbot/dnspod_client.py:ro
    entrypoint: [ "/bin/sh", "/certbot-entrypoint.sh" ]
    environment:
      - DOMAIN=${DOMAIN:-backbuy.cn}
      - EMAIL=${EMAIL}
      - TENCENT_CLOUD_SECRET_ID=${TENCENT_CLOUD_SECRET_ID}
      - TENCENT_CLOUD_SECRET_KEY=${TENCENT_CLOUD_SECRET_KEY}

  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    environment:
      POSTGRES_USER: one_recycle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: one_recycle
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U one_recycle" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: ${REGISTRY:-ghcr.io/xuanyiying}/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://one_recycle:${DB_PASSWORD}@postgres:5432/one_recycle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3002/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  admin-web:
    image: ${REGISTRY:-ghcr.io/xuanyiying}/one-recycle/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    depends_on:
      - api-gateway
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok || r.status === 404 ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: one-recycle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/https.conf.template:/tmp/https.conf.template:ro
      - ./nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./nginx/generate-cors.sh:/nginx/generate-cors.sh:ro
      - ./nginx/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - ./ssl:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - ./www/html:/var/www/html:ro
    environment:
      - DOMAIN=${DOMAIN:-backbuy.cn}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://backbuy.cn,https://www.backbuy.cn,https://admin.backbuy.cn,https://api.backbuy.cn}
    depends_on:
      - api-gateway
      - admin-web
    entrypoint: [ "/bin/sh", "/nginx-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
