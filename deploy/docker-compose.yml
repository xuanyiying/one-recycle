services:
  certbot:
    image: certbot/certbot:latest
    container_name: one-recycle-certbot
    restart: always
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c '
      trap "exit 0" TERM INT
      while true; do
        if [ -d "/etc/letsencrypt/live/${DOMAIN}" ]; then
          certbot renew --webroot -w /var/www/certbot --quiet 2>/dev/null || true
        else
          certbot certonly --webroot -w /var/www/certbot \
            -d "${DOMAIN}" -d "www.${DOMAIN}" -d "api.${DOMAIN}" -d "admin.${DOMAIN}" \
            --email "${EMAIL}" --agree-tos --no-eff-email --non-interactive 2>/dev/null || true
        fi
        sleep 12h
      done
      '
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}

  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    environment:
      POSTGRES_USER: one_recycle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: one_recycle
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one_recycle"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${REGISTRY:-ghcr.io/xuanyiying}/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://one_recycle:${DB_PASSWORD}@postgres:5432/one_recycle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  admin-web:
    image: ${REGISTRY:-ghcr.io/xuanyiying}/one-recycle/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: one-recycle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/https.conf.template:/tmp/https.conf.template:ro
      - ./nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot-webroot:/var/www/certbot:ro
    environment:
      - DOMAIN=${DOMAIN:-backbuy.cn}
    depends_on:
      - backend
      - admin-web
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
