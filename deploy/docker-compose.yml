services:
  # Certbot SSL 证书管理
  # 通过 webroot 方式验证域名，需要 nginx 先启动（HTTP 80 可用）
  # 首次部署：nginx 用自签名证书启动 → certbot 申请正式证书 → nginx 自动 reload
  certbot:
    image: certbot/certbot:latest
    container_name: one-recycle-certbot
    restart: always
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    depends_on:
      nginx:
        condition: service_started
    entrypoint: >
      sh -c ' trap "exit 0" TERM INT while true; do
        DOMAIN_NAME="$${DOMAIN:-backbuy.cn}"
        CERT_PATH="/etc/letsencrypt/live/$${DOMAIN_NAME}"
        if [ -d "$$CERT_PATH" ] && [ -f "$$CERT_PATH/fullchain.pem" ] && [ -f "$$CERT_PATH/privkey.pem" ]; then
          echo "[$(date)] Renewing certificate for $${DOMAIN_NAME}..."
          certbot renew --webroot -w /var/www/certbot --quiet 2>&1 || echo "[$(date)] Renewal failed, will retry in 12h"
        else
          echo "[$(date)] Requesting initial certificate for $${DOMAIN_NAME}..."
          certbot certonly --webroot -w /var/www/certbot \
            -d "$${DOMAIN_NAME}" -d "www.$$DOMAIN_NAME" -d "api.$$DOMAIN_NAME" -d "admin.$$DOMAIN_NAME" \
            --email "$${EMAIL}" --agree-tos --no-eff-email --non-interactive 2>&1 || echo "[$(date)] Certificate request failed, will retry in 12h"
        fi
        sleep 12h
      done '
    environment:
      - DOMAIN=${DOMAIN:-backbuy.cn}
      - EMAIL=${EMAIL}

  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    environment:
      POSTGRES_USER: one_recycle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: one_recycle
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U one_recycle" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: ${REGISTRY:-ghcr.io/xuanyiying}/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://one_recycle:${DB_PASSWORD}@postgres:5432/one_recycle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3002/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  admin-web:
    image: ${REGISTRY:-ghcr.io/xuanyiying}/one-recycle/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    depends_on:
      - api-gateway
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok || r.status === 404 ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: one-recycle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/https.conf.template:/tmp/https.conf.template:ro
      - ./nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./nginx/generate-cors.sh:/nginx/generate-cors.sh:ro
      - ./nginx/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - ./ssl:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - ./www/html:/var/www/html:ro
    environment:
      - DOMAIN=${DOMAIN:-backbuy.cn}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://backbuy.cn,https://www.backbuy.cn,https://admin.backbuy.cn,https://api.backbuy.cn}
    depends_on:
      - api-gateway
      - admin-web
    entrypoint: [ "/bin/sh", "/nginx-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
