services:
  postgres:
    image: postgres:15-alpine
    container_name: one-recycle-postgres
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: one_recycle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: one_recycle
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U one_recycle" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: one-recycle-redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: docker.cnb.cool/udefined.cc/one-recycle/server:${IMAGE_TAG:-latest}
    container_name: one-recycle-api-gateway
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 3002
      RUN_SEED: '1'
      DATABASE_URL: postgresql://one_recycle:${DB_PASSWORD}@postgres:5432/one_recycle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3002/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  admin-web:
    image: docker.cnb.cool/udefined.cc/one-recycle/admin-web:${IMAGE_TAG:-latest}
    container_name: one-recycle-admin-web
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      API_BACKEND_URL: http://api-gateway:3002
    depends_on:
      - api-gateway
    networks:
      - one-recycle-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok || r.status === 404 ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: one-recycle-caddy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www/html:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - one-recycle-network
    depends_on:
      - api-gateway
      - admin-web
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  caddy_data:
  caddy_config:

networks:
  one-recycle-network:
    driver: bridge
