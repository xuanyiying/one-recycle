syntax = "proto3";
package notification;

service NotificationService {
  rpc SendNotification (SendNotificationRequest) returns (SendNotificationResponse);
  rpc SendBatch (SendBatchRequest) returns (SendBatchResponse);
  rpc CreateTemplate (CreateTemplateRequest) returns (TemplateResponse);
  rpc UpdateTemplate (UpdateTemplateRequest) returns (TemplateResponse);
  rpc GetTemplate (GetTemplateRequest) returns (TemplateResponse);
  rpc ListTemplates (ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CallbackStatus (CallbackStatusRequest) returns (CallbackStatusResponse);
}

message Recipient {
  string userId = 1;
  string phoneNumber = 2;
  string email = 3;
}

message NotificationContent {
  string title = 1;
  string body = 2;
}

message SendNotificationRequest {
  string type = 1; // SMS/EMAIL/PUSH/IN_APP/WEBHOOK
  Recipient recipient = 2;
  NotificationContent content = 3;
}

message SendNotificationResponse {
  string id = 1;
  bool success = 2;
}

message SendBatchRequest {
  string type = 1;
  repeated SendNotificationRequest notifications = 2;
}

message SendBatchResponse {
  int32 successCount = 1;
  int32 failedCount = 2;
}

message CreateTemplateRequest {
  string name = 1;
  string type = 2;
  string subject = 3;
  string content = 4;
  repeated string variables = 5;
}

message UpdateTemplateRequest {
  string id = 1;
  string name = 2;
  string subject = 3;
  string content = 4;
  repeated string variables = 5;
}

message GetTemplateRequest { string id = 1; }
message ListTemplatesRequest { optional string type = 1; }

message TemplateResponse {
  string id = 1;
  string name = 2;
  string type = 3;
  string subject = 4;
  string content = 5;
  repeated string variables = 6;
}

message ListTemplatesResponse { repeated TemplateResponse templates = 1; }

message CallbackStatusRequest { string id = 1; string status = 2; string messageId = 3; }
message CallbackStatusResponse { bool success = 1; }

