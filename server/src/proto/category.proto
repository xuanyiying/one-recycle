syntax = "proto3";

package category;

service CategoryService {
  rpc GetCategory (GetCategoryRequest) returns (CategoryResponse);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc CreateCategory (CreateCategoryRequest) returns (CategoryResponse);
  rpc UpdateCategory (UpdateCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory (DeleteCategoryRequest) returns (Empty);
  rpc GetCategoryTree (GetCategoryTreeRequest) returns (CategoryTreeResponse);
  rpc GetPricingEstimate (PricingEstimateRequest) returns (PricingEstimateResponse);
}

message GetCategoryRequest {
  int32 id = 1;
}

message ListCategoriesRequest {
  optional string type = 1;
  optional int32 parentId = 2;
  optional bool isVisible = 3;
  optional bool isFeatured = 4;
  optional string keyword = 5;
  int32 page = 6;
  int32 limit = 7;
}

message CreateCategoryRequest {
  string name = 1;
  optional string description = 2;
  string type = 3;
  optional int32 parentId = 4;
  optional double unitPrice = 5;
  optional string priceType = 6;
  optional string unit = 7;
  optional string currency = 8;
  optional string iconUrl = 9;
  optional int32 sortOrder = 10;
  optional bool isVisible = 11;
  optional bool isFeatured = 12;
  optional string slug = 13;
  optional double basePrice = 14;
  optional double minWeight = 15;
  optional double maxWeight = 16;
}

message UpdateCategoryRequest {
  int32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string type = 4;
  optional int32 parentId = 5;
  optional double unitPrice = 6;
  optional string priceType = 7;
  optional string unit = 8;
  optional string currency = 9;
  optional string iconUrl = 10;
  optional int32 sortOrder = 11;
  optional bool isVisible = 12;
  optional bool isFeatured = 13;
  optional string slug = 14;
  optional double basePrice = 15;
  optional double minWeight = 16;
  optional double maxWeight = 17;
}

message DeleteCategoryRequest {
  int32 id = 1;
}

message GetCategoryTreeRequest {
  optional int32 parentId = 1;
}

message PricingEstimateRequest {
  repeated PricingItem items = 1;
  optional string tenantId = 2;
  optional string orderType = 3;
}

message PricingItem {
  int32 categoryId = 1;
  optional string categoryName = 2;
  optional string condition = 3;
  optional double weight = 4;
  optional int32 quantity = 5;
}

message PricingEstimateResponse {
  PriceRange itemsTotal = 1;
  double serviceFee = 2;
  PriceRange totalEstimate = 3;
  repeated PriceBreakdown breakdown = 4;
}

message PriceRange {
  double min = 1;
  double max = 2;
  string currency = 3;
}

message PriceBreakdown {
  int32 itemId = 1;
  string itemName = 2;
  int32 quantity = 3;
  double weight = 4;
  double unitPrice = 5;
  PriceRange subtotal = 6;
}

message CategoryResponse {
  int32 id = 1;
  string name = 2;
  optional string description = 3;
  string type = 4;
  optional int32 parentId = 5;
  optional string priceType = 6;
  optional double unitPrice = 7;
  optional string unit = 8;
  optional string currency = 9;
  optional string iconUrl = 10;
  int32 sortOrder = 11;
  bool isVisible = 12;
  bool isFeatured = 13;
  int32 level = 14;
  string path = 15;
  optional string slug = 16;
  optional double basePrice = 17;
  optional string createdAt = 18;
  optional string updatedAt = 19;
}

message ListCategoriesResponse {
  repeated CategoryResponse items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 totalPages = 5;
}

message CategoryTreeResponse {
  repeated CategoryResponse items = 1;
}

message Empty {}
