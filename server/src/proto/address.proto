syntax = "proto3";

package address;

service AddressService {
  rpc CreateAddress(CreateAddressRequest) returns (AddressResponse);
  rpc GetAddresses(GetAddressesRequest) returns (AddressListResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (AddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (Empty);
}

message CreateAddressRequest {
  int64 userId = 1;
  string name = 2;
  string mobile = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  optional string town = 7;
  optional string street = 8;
  optional string zipCode = 9;
  string detail = 10;
  bool isDefault = 11;
}

message GetAddressesRequest {
  int64 userId = 1;
}

message UpdateAddressRequest {
  int64 id = 1;
  string name = 2;
  string mobile = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  optional string town = 7;
  optional string street = 8;
  optional string zipCode = 9;
  string detail = 10;
  bool isDefault = 11;
}

message DeleteAddressRequest {
  int64 id = 1;
}

message AddressResponse {
  int64 id = 1;
  int64 userId = 2;
  string name = 3;
  string mobile = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  optional string town = 8;
  optional string street = 9;
  optional string zipCode = 10;
  string detail = 11;
  bool isDefault = 12;
  string createdAt = 13;
  string updatedAt = 14;
}

message AddressListResponse {
  repeated AddressResponse addresses = 1;
}

message Empty {}
