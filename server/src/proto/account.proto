syntax = "proto3";

package account;

service AccountService {
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc CreateAddress(CreateAddressRequest) returns (AddressResponse);
  rpc GetAddresses(GetAddressesRequest) returns (AddressListResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (AddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (Empty);
}

message GetUserRequest {
  int64 id = 1;
}

message CreateUserRequest {
  string mobile = 1;
  string nickname = 2;
  string avatar_url = 3;
}

message UpdateUserRequest {
  int64 id = 1;
  string nickname = 2;
  string avatar_url = 3;
}

message CreateAddressRequest {
  int64 user_id = 1;
  string name = 2;
  string mobile = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  string town = 7;
  string street = 8;
  string zipCode = 9;
  string detail = 10;
  bool is_default = 11;
}

message GetAddressesRequest {
  int64 user_id = 1;
}

message UpdateAddressRequest {
  int64 id = 1;
  string name = 2;
  string mobile = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  string detail = 7;
  bool is_default = 8;
}

message DeleteAddressRequest {
  int64 id = 1;
}

message UserResponse {
  int64 id = 1;
  string mobile = 2;
  string nickname = 3;
  string avatar_url = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
}

message AddressResponse {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string mobile = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail = 8;
  bool is_default = 9;
  string created_at = 10;
  string updated_at = 11;
}

message AddressListResponse {
  repeated AddressResponse addresses = 1;
}

message Empty {}
