syntax = "proto3";

package order;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc UpdateOrder (UpdateOrderRequest) returns (UpdateOrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
}

message CreateOrderRequest {
  int64 userId = 1;
  int64 addressId = 2;
  repeated OrderItemInput items = 3;
  string remark = 4;
}

message OrderItemInput {
  int64 categoryId = 1;
  double estimatedWeight = 2;
  double unitPrice = 3;
}

message CreateOrderResponse {
  bool success = 1;
  int64 orderId = 2;
  string message = 3;
}

message GetOrderRequest {
  int64 orderId = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message Order {
  int64 id = 1;
  string orderNo = 2;
  int64 userId = 3;
  int64 addressId = 4;
  string status = 5;
  string orderType = 6;
  int32 priority = 7;
  string expectPickupTime = 8;
  string actualPickupTime = 9;
  string expectDeliveryTime = 10;
  string actualDeliveryTime = 11;
  string estimatedAmount = 12;
  string settlementAmount = 13;
  string payAmount = 14;
  string channel = 15;
  string remark = 16;
  string source = 17;
  string createdAt = 18;
  string updatedAt = 19;
  repeated OrderItem items = 20;
  repeated OrderAssignment assignments = 21;
}

message OrderItem {
  int64 id = 1;
  int64 orderId = 2;
  int64 categoryId = 3;
  double estimatedWeight = 4;
  double actualWeight = 5;
  double unitPrice = 6;
  double amount = 7;
  string createdAt = 8;
}

message OrderAssignment {
  int64 id = 1;
  int64 orderId = 2;
  int64 courierId = 3;
  string status = 4;
  string acceptedAt = 5;
  string arrivedAt = 6;
  string finishedAt = 7;
  string createdAt = 8;
}

message UpdateOrderRequest {
  int64 orderId = 1;
  string status = 2;
  string remark = 3;
}

message UpdateOrderResponse {
  bool success = 1;
  Order order = 2;
}

message ListOrdersRequest {
  int64 userId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message CancelOrderRequest {
  int64 orderId = 1;
}

message CancelOrderResponse {
  bool success = 1;
  string message = 2;
}
