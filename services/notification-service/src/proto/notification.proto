syntax = "proto3";

package notification;

service NotificationService {
  // Email notifications
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
  rpc SendBulkEmail(SendBulkEmailRequest) returns (SendBulkEmailResponse);
  
  // SMS notifications
  rpc SendSMS(SendSMSRequest) returns (SendSMSResponse);
  rpc SendBulkSMS(SendBulkSMSRequest) returns (SendBulkSMSResponse);
  
  // Push notifications
  rpc SendPushNotification(SendPushNotificationRequest) returns (SendPushNotificationResponse);
  rpc SendBulkPushNotification(SendBulkPushNotificationRequest) returns (SendBulkPushNotificationResponse);
  
  // Template management
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  
  // Notification history
  rpc GetNotificationHistory(GetNotificationHistoryRequest) returns (GetNotificationHistoryResponse);
  rpc GetNotificationStatus(GetNotificationStatusRequest) returns (GetNotificationStatusResponse);
}

// Email messages
message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string body = 3;
  string html_body = 4;
  repeated string cc = 5;
  repeated string bcc = 6;
  repeated Attachment attachments = 7;
  string template_id = 8;
  map<string, string> template_data = 9;
}

message SendEmailResponse {
  bool success = 1;
  string message_id = 2;
  string error = 3;
}

message SendBulkEmailRequest {
  repeated SendEmailRequest emails = 1;
}

message SendBulkEmailResponse {
  repeated SendEmailResponse results = 1;
  int32 total_sent = 2;
  int32 total_failed = 3;
}

// SMS messages
message SendSMSRequest {
  string to = 1;
  string message = 2;
  string template_id = 3;
  map<string, string> template_data = 4;
}

message SendSMSResponse {
  bool success = 1;
  string message_id = 2;
  string error = 3;
}

message SendBulkSMSRequest {
  repeated SendSMSRequest sms_messages = 1;
}

message SendBulkSMSResponse {
  repeated SendSMSResponse results = 1;
  int32 total_sent = 2;
  int32 total_failed = 3;
}

// Push notifications
message SendPushNotificationRequest {
  string device_token = 1;
  string title = 2;
  string body = 3;
  map<string, string> data = 4;
  string template_id = 5;
  map<string, string> template_data = 6;
  PushNotificationPlatform platform = 7;
}

message SendPushNotificationResponse {
  bool success = 1;
  string message_id = 2;
  string error = 3;
}

message SendBulkPushNotificationRequest {
  repeated SendPushNotificationRequest notifications = 1;
}

message SendBulkPushNotificationResponse {
  repeated SendPushNotificationResponse results = 1;
  int32 total_sent = 2;
  int32 total_failed = 3;
}

// Template management
message Template {
  string id = 1;
  string name = 2;
  NotificationType type = 3;
  string subject = 4;
  string body = 5;
  string html_body = 6;
  repeated string variables = 7;
  string created_at = 8;
  string updated_at = 9;
}

message CreateTemplateRequest {
  string name = 1;
  NotificationType type = 2;
  string subject = 3;
  string body = 4;
  string html_body = 5;
  repeated string variables = 6;
}

message CreateTemplateResponse {
  Template template = 1;
}

message GetTemplateRequest {
  string id = 1;
}

message GetTemplateResponse {
  Template template = 1;
}

message UpdateTemplateRequest {
  string id = 1;
  string name = 2;
  string subject = 3;
  string body = 4;
  string html_body = 5;
  repeated string variables = 6;
}

message UpdateTemplateResponse {
  Template template = 1;
}

message DeleteTemplateRequest {
  string id = 1;
}

message DeleteTemplateResponse {
  bool success = 1;
}

message ListTemplatesRequest {
  int32 page = 1;
  int32 limit = 2;
  NotificationType type = 3;
}

message ListTemplatesResponse {
  repeated Template templates = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// Notification history
message NotificationHistory {
  string id = 1;
  NotificationType type = 2;
  string recipient = 3;
  string subject = 4;
  string body = 5;
  NotificationStatus status = 6;
  string error = 7;
  string sent_at = 8;
  string delivered_at = 9;
  string template_id = 10;
}

message GetNotificationHistoryRequest {
  string user_id = 1;
  NotificationType type = 2;
  int32 page = 3;
  int32 limit = 4;
  string start_date = 5;
  string end_date = 6;
}

message GetNotificationHistoryResponse {
  repeated NotificationHistory notifications = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetNotificationStatusRequest {
  string notification_id = 1;
}

message GetNotificationStatusResponse {
  NotificationHistory notification = 1;
}

// Common types
message Attachment {
  string filename = 1;
  string content_type = 2;
  bytes content = 3;
}

enum NotificationType {
  EMAIL = 0;
  SMS = 1;
  PUSH = 2;
}

enum NotificationStatus {
  PENDING = 0;
  SENT = 1;
  DELIVERED = 2;
  FAILED = 3;
  BOUNCED = 4;
}

enum PushNotificationPlatform {
  IOS = 0;
  ANDROID = 1;
  WEB = 2;
}