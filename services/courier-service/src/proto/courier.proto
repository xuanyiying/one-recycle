syntax = "proto3";

package courier;

service CourierService {
  rpc CreateCourier(CreateCourierRequest) returns (CourierResponse);
  rpc GetCourier(GetCourierRequest) returns (CourierResponse);
  rpc UpdateCourier(UpdateCourierRequest) returns (CourierResponse);
  rpc DeleteCourier(DeleteCourierRequest) returns (DeleteCourierResponse);
  rpc ListCouriers(ListCouriersRequest) returns (ListCouriersResponse);
  rpc AssignDelivery(AssignDeliveryRequest) returns (DeliveryResponse);
  rpc UpdateDeliveryStatus(UpdateDeliveryStatusRequest) returns (DeliveryResponse);
  rpc GetDelivery(GetDeliveryRequest) returns (DeliveryResponse);
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
}

message CreateCourierRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string vehicleType = 4;
  string licenseNumber = 5;
}

message UpdateCourierRequest {
  string id = 1;
  optional string name = 2;
  optional string email = 3;
  optional string phone = 4;
  optional string vehicleType = 5;
  optional string licenseNumber = 6;
  optional string status = 7;
  optional string location = 8;
}

message GetCourierRequest {
  string id = 1;
}

message DeleteCourierRequest {
  string id = 1;
}

message ListCouriersRequest {
  int32 page = 1;
  int32 limit = 2;
  optional string status = 3;
}

message CourierResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string vehicleType = 5;
  string licenseNumber = 6;
  string status = 7;
  optional string location = 8;
  optional double rating = 9;
  int32 totalDeliveries = 10;
  string createdAt = 11;
  string updatedAt = 12;
}

message DeleteCourierResponse {
  bool success = 1;
  string message = 2;
}

message ListCouriersResponse {
  repeated CourierResponse couriers = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message AssignDeliveryRequest {
  string orderId = 1;
  string courierId = 2;
  string pickupAddress = 3;
  string deliveryAddress = 4;
  optional string estimatedTime = 5;
}

message UpdateDeliveryStatusRequest {
  string id = 1;
  string status = 2;
  optional string notes = 3;
}

message GetDeliveryRequest {
  string id = 1;
}

message ListDeliveriesRequest {
  int32 page = 1;
  int32 limit = 2;
  optional string courierId = 3;
  optional string status = 4;
}

message DeliveryResponse {
  string id = 1;
  string orderId = 2;
  string courierId = 3;
  string status = 4;
  string pickupAddress = 5;
  string deliveryAddress = 6;
  optional string estimatedTime = 7;
  optional string actualPickupTime = 8;
  optional string actualDeliveryTime = 9;
  optional string notes = 10;
  string createdAt = 11;
  string updatedAt = 12;
}

message ListDeliveriesResponse {
  repeated DeliveryResponse deliveries = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}