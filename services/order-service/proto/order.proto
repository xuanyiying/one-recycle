syntax = "proto3";

package order;

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (OrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
  rpc AssignOrder(AssignOrderRequest) returns (AssignmentResponse);
  rpc UpdateAssignmentStatus(UpdateAssignmentStatusRequest) returns (AssignmentResponse);
}

message CreateOrderRequest {
  int64 user_id = 1;
  int64 address_id = 2;
  string expect_pickup_time = 3;
  string channel = 4;
  string remark = 5;
  repeated OrderItemInput items = 6;
}

message OrderItemInput {
  int64 category_id = 1;
  string estimated_weight = 2;
  string unit_price = 3;
}

message GetOrderRequest {
  int64 id = 1;
}

message UpdateOrderStatusRequest {
  int64 id = 1;
  string status = 2;
}

message CancelOrderRequest {
  int64 id = 1;
  string reason = 2;
}

message AssignOrderRequest {
  int64 order_id = 1;
  int64 courier_id = 2;
}

message UpdateAssignmentStatusRequest {
  int64 assignment_id = 1;
  string status = 2;
}

message OrderResponse {
  int64 id = 1;
  string order_no = 2;
  int64 user_id = 3;
  int64 address_id = 4;
  string status = 5;
  string expect_pickup_time = 6;
  string actual_pickup_time = 7;
  string estimated_amount = 8;
  string settlement_amount = 9;
  string pay_amount = 10;
  string channel = 11;
  string remark = 12;
  string created_at = 13;
  string updated_at = 14;
  repeated OrderItemResponse items = 15;
  repeated AssignmentResponse assignments = 16;
}

message OrderItemResponse {
  int64 id = 1;
  int64 category_id = 2;
  string estimated_weight = 3;
  string actual_weight = 4;
  string unit_price = 5;
  string amount = 6;
}

message AssignmentResponse {
  int64 id = 1;
  int64 courier_id = 2;
  string status = 3;
  string accepted_at = 4;
  string arrived_at = 5;
  string finished_at = 6;
  string created_at = 7;
}