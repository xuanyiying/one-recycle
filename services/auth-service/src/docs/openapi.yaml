                                  format: double
                                  description: 距离（公里）
                                  example: 2.5
                      meta:
                        type: object
                        properties:
                          pagination:
                            $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - couriers
      summary: 创建快递员
      description: 注册新的快递员（管理员权限）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
                - idCard
                - licensePlate
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: '李四'
                phone:
                  type: string
                  pattern: '^1[3-9]\d{9}$'
                  example: '13900139000'
                idCard:
                  type: string
                  pattern: '^[1-9]\d{5}(18|19|20)\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)\d{3}[0-9Xx]$'
                  example: '110101199001011234'
                licensePlate:
                  type: string
                  pattern: '^[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼使领A-Z]{1}[A-Z]{1}[A-Z0-9]{4}[A-Z0-9挂学警港澳]{1}$'
                  example: '京A12345'
                workingHours:
                  type: object
                  properties:
                    start:
                      type: string
                      pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
                      example: '08:00'
                    end:
                      type: string
                      pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
                      example: '18:00'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Courier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
