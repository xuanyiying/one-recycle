syntax = "proto3";

package inventory;

service InventoryService {
  // Item management
  rpc CreateItem(CreateItemRequest) returns (ItemResponse);
  rpc GetItem(GetItemRequest) returns (ItemResponse);
  rpc UpdateItem(UpdateItemRequest) returns (ItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  
  // Stock management
  rpc UpdateStock(UpdateStockRequest) returns (StockResponse);
  rpc GetStock(GetStockRequest) returns (StockResponse);
  rpc CheckAvailability(CheckAvailabilityRequest) returns (AvailabilityResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReservationResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
}

// Item messages
message Item {
  string id = 1;
  string name = 2;
  string description = 3;
  string category_id = 4;
  double price = 5;
  string sku = 6;
  int32 quantity = 7;
  int32 reserved_quantity = 8;
  int32 min_stock_level = 9;
  ItemStatus status = 10;
  string created_at = 11;
  string updated_at = 12;
}

enum ItemStatus {
  ACTIVE = 0;
  INACTIVE = 1;
  OUT_OF_STOCK = 2;
  DISCONTINUED = 3;
}

// Request/Response messages
message CreateItemRequest {
  string name = 1;
  string description = 2;
  string category_id = 3;
  double price = 4;
  string sku = 5;
  int32 quantity = 6;
  int32 min_stock_level = 7;
}

message GetItemRequest {
  string id = 1;
}

message UpdateItemRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string category_id = 4;
  optional double price = 5;
  optional string sku = 6;
  optional int32 quantity = 7;
  optional int32 min_stock_level = 8;
  optional ItemStatus status = 9;
}

message DeleteItemRequest {
  string id = 1;
}

message DeleteItemResponse {
  bool success = 1;
  string message = 2;
}

message ListItemsRequest {
  int32 page = 1;
  int32 limit = 2;
  optional string category_id = 3;
  optional ItemStatus status = 4;
  optional string search = 5;
}

message ListItemsResponse {
  repeated Item items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ItemResponse {
  Item item = 1;
}

// Stock management messages
message UpdateStockRequest {
  string item_id = 1;
  int32 quantity_change = 2;
  string reason = 3;
}

message GetStockRequest {
  string item_id = 1;
}

message StockResponse {
  string item_id = 1;
  int32 quantity = 2;
  int32 reserved_quantity = 3;
  int32 available_quantity = 4;
}

message CheckAvailabilityRequest {
  string item_id = 1;
  int32 requested_quantity = 2;
}

message AvailabilityResponse {
  bool available = 1;
  int32 available_quantity = 2;
}

message ReserveStockRequest {
  string item_id = 1;
  int32 quantity = 2;
  string reservation_id = 3;
}

message ReservationResponse {
  bool success = 1;
  string reservation_id = 2;
  string message = 3;
}

message ReleaseReservationRequest {
  string reservation_id = 1;
}

message ReleaseReservationResponse {
  bool success = 1;
  string message = 2;
}