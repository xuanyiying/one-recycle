# ============================================================
# Tag 推送部署 + 手动触发部署
# ============================================================

$:
  tag_push:
    - name: deploy-by-tag
      <<: *deploy-base
      stages:
        - name: determine-mode
          script: |
            if [[ "$CNB_BRANCH" == *"-micro" ]]; then
              echo "##[set-output DEPLOY_MODE=microservices]"
            else
              echo "##[set-output DEPLOY_MODE=monolith]"
            fi
          exports:
            DEPLOY_MODE: DEPLOY_MODE

        - name: set-image-tag
          script: echo -n "${CNB_COMMIT_SHORT}"
          exports:
            info: IMAGE_TAG

        - *build-server
        - *build-admin-web
        - *push-images
        - *setup-ssh

        - name: deploy-monolith
