              grep -v '^IMAGE_TAG=' "$ENV_FILE" | grep -v '^DOMAIN=' | grep -v '^DB_PASSWORD=' | grep -v '^REDIS_PASSWORD='
            } > "$MICROSERVICES_ENV"

            cd "$DEPLOY_DIR"
            docker compose pull api-gateway admin-web
            docker compose down || true
            docker compose up -d --no-build
            sleep 15
            docker compose ps
            docker image prune -f
            echo "=== Monolith deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
            JWT_SECRET: ${JWT_SECRET:-}

        - name: deploy-microservices
          if: '[ "$DEPLOY_MODE" = "microservices" ]'
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              CNB_BRANCH="$CNB_BRANCH" \
              IMAGE_TAG="$IMAGE_TAG" \
              DOMAIN="$DOMAIN" \
              JWT_SECRET="$JWT_SECRET" \
              CNB_REGISTRY_TOKEN="$CNB_REGISTRY_TOKEN" \
              'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            CONFIG_DIR="$DEPLOY_DIR/config"
            ENV_FILE="$CONFIG_DIR/.env.production"
            echo "=== Deploying microservices (manual trigger) ==="

            echo "$CNB_REGISTRY_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin

            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard "origin/${CNB_BRANCH}" 2>/dev/null || git reset --hard "$CNB_BRANCH"

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},docker,config}

            if [ ! -f "$ENV_FILE" ]; then
              touch "$ENV_FILE"
            fi

            _set_if_missing() {
              local key="$1" value="$2"
              if ! grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                echo "${key}=${value}" >> "$ENV_FILE"
              fi
            }

            _set_if_missing DB_PASSWORD 'change_me'
            _set_if_missing REDIS_PASSWORD 'change_me'
            _set_if_missing JWT_SECRET "$(openssl rand -base64 48)"
            _set_if_missing JWT_EXPIRES_IN '7d'
            _set_if_missing ACCESS_TOKEN_EXPIRES_IN_SECONDS '7200'
            _set_if_missing CORS_ORIGINS "https://${DOMAIN},https://www.${DOMAIN},https://admin.${DOMAIN},https://api.${DOMAIN}"

            if [ -n "$JWT_SECRET" ] && [ "$JWT_SECRET" != 'change_me' ]; then
              sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${JWT_SECRET}/" "$ENV_FILE"
            fi

            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              grep -v '^IMAGE_TAG=' "$ENV_FILE" | grep -v '^DOMAIN=' | grep -v '^DB_PASSWORD=' | grep -v '^REDIS_PASSWORD='
            } > "$DEPLOY_DIR/.env.production"

            cd "$DEPLOY_DIR"
            docker compose -f docker/docker-compose.production.yml pull
            docker compose -f docker/docker-compose.production.yml down || true
            docker compose -f docker/docker-compose.production.yml up -d --no-build
            sleep 15
            docker compose -f docker/docker-compose.production.yml ps
            docker image prune -f
            echo "=== Microservices deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
            JWT_SECRET: ${JWT_SECRET:-}

        - *health-check-monolith
