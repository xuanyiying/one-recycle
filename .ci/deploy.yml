# ============================================================
# 部署流水线 — 细粒度按需部署
# ============================================================
#
# 改动要点：
#   1. 使用 ifModify 实现按需部署：server 变更部署 server，admin-web 变更部署 admin-web
#   2. 小程序 (apps/mini-client) 修改不触发部署
#   3. 移除 docker compose down，使用定向更新避免不必要的服务中断
#   4. 修复微服务健康检查端口（gRPC 服务使用 PORT+10000）
#   5. SSH 部署仅做 docker compose pull + up，大幅缩短部署时间
#
# 所需密钥（通过 imports 导入，请在密钥仓库中配置 deploy.yml）：
#   DEPLOY_HOST        - 部署服务器 IP
#   DEPLOY_USER        - SSH 用户名
#   DEPLOY_KEY         - SSH 私钥
#   DOMAIN             - 域名（默认 backbuy.cn）
#   CNB_REGISTRY_TOKEN - CNB Registry 访问令牌（服务器拉取镜像用）
#   JWT_SECRET         - JWT 签名密钥（首次部署自动生成）
# ============================================================

# --- 共用部署配置 ---

.deploy-runner: &deploy-runner
  cpus: 4

.deploy-base: &deploy-base
  runner: *deploy-runner
  services:
    - docker
  imports:
    - https://cnb.cool/udefined.cc/secrets/-/blob/main/deploy.yml
  lock:
    key: deploy-lock
    wait: true

# --- ifModify 路径配置 ---

.server-if-modify: &server-if-modify
  - server/**
  - .ci/**
  - deploy/**

.admin-web-if-modify: &admin-web-if-modify
  - apps/admin-web/**
  - .ci/**
  - deploy/**

# --- 共用构建阶段 ---

.build-server: &build-server
  name: build-server-image
  script: |
    docker build \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${IMAGE_TAG} \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${CNB_BRANCH} \
      ./server

.build-admin-web: &build-admin-web
  name: build-admin-web-image
  script: |
    docker build \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${IMAGE_TAG} \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${CNB_BRANCH} \
      --build-arg NEXT_PUBLIC_API_URL=/api \
      --build-arg API_BACKEND_URL=http://api-gateway:3002 \
      ./apps/admin-web

.push-server-images: &push-server-images
  name: push-server-images
  script: |
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${IMAGE_TAG}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${CNB_BRANCH}

.push-admin-web-images: &push-admin-web-images
  name: push-admin-web-images
  script: |
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${IMAGE_TAG}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${CNB_BRANCH}

.push-all-images: &push-all-images
  name: push-images
  script: |
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${IMAGE_TAG}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${CNB_BRANCH}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${IMAGE_TAG}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${CNB_BRANCH}

.setup-ssh: &setup-ssh
  name: setup-ssh
  script: |
    mkdir -p ~/.ssh
    echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
    chmod 600 ~/.ssh/id_rsa
    ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

# --- 共用 health-check ---

.health-check-server-monolith: &health-check-server-monolith
  name: health-check
  script: |
    DOMAIN="${DOMAIN:-backbuy.cn}"
    ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'ENDSSH'
    cd $HOME/one-recycle/deploy
    echo "=== Waiting for api-gateway to become healthy ==="
    for i in $(seq 1 18); do
      STATUS=$(docker inspect --format='{{.State.Health.Status}}' one-recycle-api-gateway 2>/dev/null || echo "not_found")
      echo "  [$i/18] api-gateway: $STATUS"
      if [ "$STATUS" = "healthy" ]; then
        echo "✅ api-gateway is healthy"
        exit 0
      fi
      sleep 10
    done
    echo "❌ api-gateway health check timed out (3min)"
    echo "=== Container status ==="
    docker compose ps -a
    echo "=== api-gateway logs ==="
    docker logs one-recycle-api-gateway --tail=50 2>&1 | tail -30
    exit 1
    ENDSSH

    echo "=== End-to-end verification ==="
    if curl -skfL --max-time 15 "https://${DOMAIN}/api/health" >/dev/null 2>&1 || \
       curl -skfL --max-time 15 "http://${DOMAIN}/api/health" >/dev/null 2>&1; then
      echo "✅ End-to-end health check passed"
    else
      echo "⚠️  Container healthy but external endpoint not reachable (may need caddy reload)"
    fi
  env:
    DOMAIN: ${DOMAIN:-backbuy.cn}

.health-check-admin-web-monolith: &health-check-admin-web-monolith
  name: health-check
  script: |
    DOMAIN="${DOMAIN:-backbuy.cn}"
    ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'ENDSSH'
    cd $HOME/one-recycle/deploy

    echo "=== Step 1: Verify server dependency ==="
    SERVER_STATUS=$(docker inspect --format='{{.State.Health.Status}}' one-recycle-api-gateway 2>/dev/null || echo "not_found")
    if [ "$SERVER_STATUS" != "healthy" ]; then
      echo "❌ api-gateway is not healthy (status: $SERVER_STATUS), admin-web depends on it"
      exit 1
    fi
    echo "✅ api-gateway dependency OK"

    echo "=== Step 2: Waiting for admin-web to become healthy ==="
    for i in $(seq 1 12); do
      STATUS=$(docker inspect --format='{{.State.Health.Status}}' one-recycle-admin-web 2>/dev/null || echo "not_found")
      echo "  [$i/12] admin-web: $STATUS"
      if [ "$STATUS" = "healthy" ]; then
        echo "✅ admin-web is healthy"
        exit 0
      fi
      sleep 5
    done
    echo "❌ admin-web health check timed out (1min)"
    echo "=== Container status ==="
    docker compose ps -a
    echo "=== admin-web logs ==="
    docker logs one-recycle-admin-web --tail=30 2>&1
    exit 1
    ENDSSH

    echo "=== End-to-end verification ==="
    if curl -skfL --max-time 15 "https://admin.${DOMAIN}/" >/dev/null 2>&1 || \
       curl -skfL --max-time 15 "http://admin.${DOMAIN}/" >/dev/null 2>&1; then
      echo "✅ Admin end-to-end health check passed"
    else
      echo "⚠️  Container healthy but external endpoint not reachable"
    fi
  env:
    DOMAIN: ${DOMAIN:-backbuy.cn}

.health-check-server-microservices: &health-check-server-microservices
  name: health-check
  script: |
    DOMAIN="${DOMAIN:-backbuy.cn}"
    ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'ENDSSH'
    cd $HOME/one-recycle/deploy
    SERVICES="api-gateway account-service order-service notification-service payment-service dispatch-service inventory-service category-service queue-service"
    echo "=== Waiting for all services to become healthy ==="
    FAILED=""
    for SVC in $SERVICES; do
      CONTAINER="one-recycle-${SVC}"
      HEALTHY=false
      for i in $(seq 1 18); do
        STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "not_found")
        if [ "$STATUS" = "healthy" ]; then
          echo "  ✅ $SVC: healthy"
          HEALTHY=true
          break
        fi
        if [ "$i" = "1" ]; then
          echo "  Waiting for $SVC (current: $STATUS)..."
        fi
        sleep 10
      done
      if [ "$HEALTHY" = "false" ]; then
        STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "not_found")
        echo "  ❌ $SVC: $STATUS (timed out)"
        FAILED="$FAILED $SVC"
      fi
    done

    if [ -n "$FAILED" ]; then
      echo "❌ Failed services:$FAILED"
      echo "=== Container status ==="
      docker compose --env-file .env.production -f docker/docker-compose.production.yml ps -a
      for SVC in $FAILED; do
        echo "=== $SVC logs ==="
        docker logs "one-recycle-${SVC}" --tail=30 2>&1 | tail -20
      done
      exit 1
    fi
    echo "✅ All services are healthy"
    ENDSSH

    echo "=== End-to-end verification ==="
    if curl -skfL --max-time 15 "https://${DOMAIN}/api/health" >/dev/null 2>&1 || \
       curl -skfL --max-time 15 "http://${DOMAIN}/api/health" >/dev/null 2>&1; then
      echo "✅ End-to-end health check passed"
    else
      echo "⚠️  Containers healthy but external endpoint not reachable"
    fi
  env:
    DOMAIN: ${DOMAIN:-backbuy.cn}

.health-check-admin-web-microservices: &health-check-admin-web-microservices
  name: health-check
  script: |
    DOMAIN="${DOMAIN:-backbuy.cn}"
    ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'ENDSSH'
    cd $HOME/one-recycle/deploy

    echo "=== Step 1: Verify server dependency ==="
    SERVER_STATUS=$(docker inspect --format='{{.State.Health.Status}}' one-recycle-api-gateway 2>/dev/null || echo "not_found")
    if [ "$SERVER_STATUS" != "healthy" ]; then
      echo "❌ api-gateway is not healthy (status: $SERVER_STATUS), admin-web depends on it"
      exit 1
    fi
    echo "✅ api-gateway dependency OK"

    echo "=== Step 2: Waiting for admin-web to become healthy ==="
    for i in $(seq 1 12); do
      STATUS=$(docker inspect --format='{{.State.Health.Status}}' one-recycle-admin-web 2>/dev/null || echo "not_found")
      echo "  [$i/12] admin-web: $STATUS"
      if [ "$STATUS" = "healthy" ]; then
        echo "✅ admin-web is healthy"
        exit 0
      fi
      sleep 5
    done
    echo "❌ admin-web health check timed out (1min)"
    echo "=== Container status ==="
    docker compose --env-file .env.production -f docker/docker-compose.production.yml ps -a
    echo "=== admin-web logs ==="
    docker logs one-recycle-admin-web --tail=30 2>&1
    exit 1
    ENDSSH

    echo "=== End-to-end verification ==="
    if curl -skfL --max-time 15 "https://admin.${DOMAIN}/" >/dev/null 2>&1 || \
       curl -skfL --max-time 15 "http://admin.${DOMAIN}/" >/dev/null 2>&1; then
      echo "✅ Admin end-to-end health check passed"
    else
      echo "⚠️  Container healthy but external endpoint not reachable"
    fi
  env:
    DOMAIN: ${DOMAIN:-backbuy.cn}

# ============================================================
# Monolith 部署 (prod 分支) — 按需部署
# ============================================================

prod:
  push:
    - name: deploy-server
      <<: *deploy-base
      ifModify: *server-if-modify
      stages:
        - name: set-image-tag
          script: echo -n "${CNB_COMMIT_SHORT}"
          exports:
            info: IMAGE_TAG

        - *build-server
        - *push-server-images
        - *setup-ssh

        - name: deploy
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              CNB_BRANCH="$CNB_BRANCH" \
              IMAGE_TAG="$IMAGE_TAG" \
              DOMAIN="$DOMAIN" \
              CNB_REGISTRY_TOKEN="$CNB_REGISTRY_TOKEN" \
              'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            CONFIG_DIR="$DEPLOY_DIR/config"
            ENV_FILE="$CONFIG_DIR/.env.production"
            echo "=== Deploying monolith server (tag: $IMAGE_TAG) ==="

            echo "$CNB_REGISTRY_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin

            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard "origin/${CNB_BRANCH}" 2>/dev/null || git reset --hard "$CNB_BRANCH"

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},config}

            if [ ! -f "$ENV_FILE" ]; then
              echo "!!! 警告: 找不到配置文件 $ENV_FILE !!!"
              echo "请确保服务器上已手动配置该文件，包含 DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET 等关键配置。"
              touch "$ENV_FILE"
            fi

            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              grep -v '^IMAGE_TAG=' "$ENV_FILE" | grep -v '^DOMAIN=' | grep -v '^DB_PASSWORD=' | grep -v '^REDIS_PASSWORD='
            } > "$DEPLOY_DIR/.env.production"

            cd "$DEPLOY_DIR"

            echo "=== Ensuring infrastructure is running ==="
            docker compose up -d postgres redis
            sleep 5

            echo "=== Pulling server image ==="
            docker compose pull api-gateway

            echo "=== Restarting server ==="
            docker compose up -d --force-recreate --no-deps api-gateway

            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Server deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}

        - *health-check-server-monolith

    - name: deploy-admin-web
      <<: *deploy-base
      ifModify: *admin-web-if-modify
      stages:
        - name: set-image-tag
          script: echo -n "${CNB_COMMIT_SHORT}"
          exports:
            info: IMAGE_TAG

        - *build-admin-web
        - *push-admin-web-images
        - *setup-ssh

        - name: deploy
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              CNB_BRANCH="$CNB_BRANCH" \
              IMAGE_TAG="$IMAGE_TAG" \
              DOMAIN="$DOMAIN" \
              CNB_REGISTRY_TOKEN="$CNB_REGISTRY_TOKEN" \
              'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            CONFIG_DIR="$DEPLOY_DIR/config"
            ENV_FILE="$CONFIG_DIR/.env.production"
            echo "=== Deploying admin-web (tag: $IMAGE_TAG) ==="

            echo "$CNB_REGISTRY_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin

            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard "origin/${CNB_BRANCH}" 2>/dev/null || git reset --hard "$CNB_BRANCH"

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},config}

            if [ ! -f "$ENV_FILE" ]; then
              echo "!!! 警告: 找不到配置文件 $ENV_FILE !!!"
              touch "$ENV_FILE"
            fi

            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              grep -v '^IMAGE_TAG=' "$ENV_FILE" | grep -v '^DOMAIN=' | grep -v '^DB_PASSWORD=' | grep -v '^REDIS_PASSWORD='
            } > "$DEPLOY_DIR/.env.production"

            cd "$DEPLOY_DIR"

            echo "=== Pulling admin-web image ==="
            docker compose pull admin-web

            echo "=== Restarting admin-web ==="
            docker compose up -d --force-recreate --no-deps admin-web

            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Admin-web deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}

        - *health-check-admin-web-monolith

