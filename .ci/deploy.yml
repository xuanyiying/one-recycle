# ============================================================
# Tag 推送部署 (全量部署)
# ============================================================

$:
  tag_push:
    - name: deploy-by-tag
      <<: *deploy-base
      stages:
        - name: determine-mode
          script: |
            if [[ "$CNB_BRANCH" == *"-micro" ]]; then
              echo "##[set-output DEPLOY_MODE=microservices]"
            else
              echo "##[set-output DEPLOY_MODE=monolith]"
            fi
          exports:
            DEPLOY_MODE: DEPLOY_MODE

        - name: set-image-tag
          script: echo -n "${CNB_COMMIT_SHORT}"
          exports:
            info: IMAGE_TAG

        - *build-server
        - *build-admin-web
        - *push-all-images
        - *setup-ssh

        - name: deploy-monolith
          if: '[ "$DEPLOY_MODE" = "monolith" ]'
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              CNB_BRANCH="$CNB_BRANCH" \
              IMAGE_TAG="$IMAGE_TAG" \
              DOMAIN="$DOMAIN" \
              CNB_REGISTRY_TOKEN="$CNB_REGISTRY_TOKEN" \
              'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            CONFIG_DIR="$DEPLOY_DIR/config"
            ENV_FILE="$CONFIG_DIR/.env.production"
            echo "=== Deploying monolith (tag: $CNB_BRANCH) ==="

            echo "$CNB_REGISTRY_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin

            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard "$CNB_BRANCH"

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},config}

            if [ ! -f "$ENV_FILE" ]; then
              echo "!!! 警告: 找不到配置文件 $ENV_FILE !!!"
              touch "$ENV_FILE"
            fi

            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
