# ============================================================
# 部署流水线 — CI 构建镜像，推送 CNB Registry，服务器只拉取
# ============================================================
#
# 改动要点：
#   1. 移除冗余的 CI 步骤（lint/typecheck/test），由 ci.yml 负责
#   2. 在 CNB 构建环境中 docker build + push 镜像
#   3. SSH 部署仅做 docker compose pull + up，大幅缩短部署时间
#
# 所需密钥（通过 imports 导入，请在密钥仓库中配置 deploy.yml）：
#   DEPLOY_HOST        - 部署服务器 IP
#   DEPLOY_USER        - SSH 用户名
#   DEPLOY_KEY         - SSH 私钥
#   DOMAIN             - 域名（默认 backbuy.cn）
#   CNB_REGISTRY_TOKEN - CNB Registry 访问令牌（服务器拉取镜像用）
#   JWT_SECRET         - JWT 签名密钥（首次部署自动生成）
# ============================================================

# --- 共用部署配置 ---

.deploy-runner: &deploy-runner
  cpus: 4

.deploy-base: &deploy-base
  runner: *deploy-runner
  services:
    - docker
  imports:
    - https://cnb.cool/udefined.cc/secrets/-/blob/main/deploy.yml
  lock:
    key: deploy-lock
    wait: true

# --- 共用构建阶段 ---

.build-server: &build-server
  name: build-server-image
  script: |
    docker build \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${IMAGE_TAG} \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${CNB_BRANCH} \
      ./server

.build-admin-web: &build-admin-web
  name: build-admin-web-image
  script: |
    docker build \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${IMAGE_TAG} \
      -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${CNB_BRANCH} \
      --build-arg NEXT_PUBLIC_API_URL=/api \
      --build-arg API_BACKEND_URL=http://api-gateway:3002 \
      ./apps/admin-web

.push-images: &push-images
  name: push-images
  script: |
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${IMAGE_TAG}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/server:${CNB_BRANCH}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${IMAGE_TAG}
    docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/admin-web:${CNB_BRANCH}

.setup-ssh: &setup-ssh
  name: setup-ssh
  script: |
    mkdir -p ~/.ssh
    echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
    chmod 600 ~/.ssh/id_rsa
    ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

# --- 共用 health-check ---

.health-check-monolith: &health-check-monolith
  name: health-check
  script: |
    sleep 30
    DOMAIN="${DOMAIN:-backbuy.cn}"
    for i in $(seq 1 10); do
      echo "Health check attempt $i/10..."
      if curl -sf --max-time 10 "https://${DOMAIN}/api/health" >/dev/null 2>&1; then
        echo "Application health passed: https://${DOMAIN}/api/health"
        exit 0
      fi
      sleep 10
    done
    echo "Health check failed"
    ssh "$DEPLOY_USER@$DEPLOY_HOST" DOMAIN="$DOMAIN" 'bash -s' <<'ENDSSH'
    cd $HOME/one-recycle/deploy
    docker compose ps -a
    echo "=== Caddy logs ==="
    docker logs one-recycle-caddy --tail=30 2>/dev/null || true
    echo "=== Backend logs ==="
    docker logs one-recycle-api-gateway --tail=30 2>/dev/null || true
    ENDSSH
    exit 1
  env:
    DOMAIN: ${DOMAIN:-backbuy.cn}

.health-check-microservices: &health-check-microservices
  name: health-check
  script: |
    sleep 30
    DOMAIN="${DOMAIN:-backbuy.cn}"
    for i in $(seq 1 10); do
      echo "Health check attempt $i/10..."
      if curl -sf --max-time 10 "https://${DOMAIN}/api/health" >/dev/null 2>&1; then
        echo "Application health passed: https://${DOMAIN}/api/health"
        exit 0
      fi
      sleep 10
    done
    echo "Health check failed"
    ssh "$DEPLOY_USER@$DEPLOY_HOST" DOMAIN="$DOMAIN" 'bash -s' <<'ENDSSH'
    cd $HOME/one-recycle/deploy
    docker compose -f docker/docker-compose.production.yml ps -a
    echo "=== Caddy logs ==="
    docker logs one-recycle-caddy --tail=30 2>/dev/null || true
    echo "=== API Gateway logs ==="
    docker logs one-recycle-api-gateway --tail=30 2>/dev/null || true
    ENDSSH
    exit 1
  env:
    DOMAIN: ${DOMAIN:-backbuy.cn}

# ============================================================
# Monolith 部署 (prod 分支)
# ============================================================

prod:
  push:
    - name: deploy-monolith
      <<: *deploy-base
      stages:
        - name: set-image-tag
          script: echo -n "${CNB_COMMIT_SHORT}"
          exports:
            info: IMAGE_TAG

        - *build-server
        - *build-admin-web
        - *push-images
        - *setup-ssh

        - name: deploy
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              CNB_BRANCH="$CNB_BRANCH" \
              IMAGE_TAG="$IMAGE_TAG" \
              DOMAIN="$DOMAIN" \
              JWT_SECRET="$JWT_SECRET" \
              CNB_REGISTRY_TOKEN="$CNB_REGISTRY_TOKEN" \
              'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            CONFIG_DIR="$DEPLOY_DIR/config"
            ENV_FILE="$CONFIG_DIR/.env.production"
            echo "=== Deploying monolith (tag: $IMAGE_TAG) ==="

            # 登录 CNB Registry
            echo "$CNB_REGISTRY_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin

            # 更新代码（Caddyfile、docker-compose 等配置文件）
            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard "origin/${CNB_BRANCH}" 2>/dev/null || git reset --hard "$CNB_BRANCH"

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},config}

            # === 写入持久化配置 (config/.env.production) ===
            # 此文件在首次部署时创建，后续部署保留已有值并补充缺失项
            if [ ! -f "$ENV_FILE" ]; then
              echo "=== 首次部署，创建配置文件 ==="
              touch "$ENV_FILE"
            fi

            # 保留已有配置，仅在缺失时写入默认值
            _set_if_missing() {
              local key="$1" value="$2"
              if ! grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                echo "${key}=${value}" >> "$ENV_FILE"
              fi
            }

            _set_if_missing DB_PASSWORD 'change_me'
            _set_if_missing REDIS_PASSWORD 'change_me'
            _set_if_missing JWT_SECRET "$(openssl rand -base64 48)"
            _set_if_missing JWT_EXPIRES_IN '7d'
            _set_if_missing ACCESS_TOKEN_EXPIRES_IN_SECONDS '7200'
            _set_if_missing CORS_ORIGINS "https://${DOMAIN},https://www.${DOMAIN},https://admin.${DOMAIN},https://api.${DOMAIN}"

            # 如果 secrets 传入了 JWT_SECRET，覆盖自动生成的值
            if [ -n "$JWT_SECRET" ] && [ "$JWT_SECRET" != 'change_me' ]; then
              sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${JWT_SECRET}/" "$ENV_FILE"
            fi

            # === 写入 docker-compose 使用的 .env.production ===
            # 此文件每次部署都会重新生成（IMAGE_TAG 会变）
            MICROSERVICES_ENV="$DEPLOY_DIR/docker/.env.production"
            MONOLITH_ENV="$DEPLOY_DIR/.env.production"
            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "DOMAIN=$DOMAIN"
              # 从持久化配置中读取 DB/Redis 密码
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              # 追加持久化配置（JWT_SECRET, CORS_ORIGINS 等）
              grep -v '^IMAGE_TAG=' "$ENV_FILE" | grep -v '^DOMAIN=' | grep -v '^DB_PASSWORD=' | grep -v '^REDIS_PASSWORD='
            } > "$MICROSERVICES_ENV"

            # 检查数据库是否已初始化
            DB_INITIALIZED=false
            if [ -d "$DEPLOY_DIR/data/postgres" ] && [ "$(ls -A "$DEPLOY_DIR/data/postgres" 2>/dev/null)" ]; then
              DB_INITIALIZED=true
              echo "=== 数据库已存在，将执行迁移 ==="
            else
              echo "=== 首次部署，将初始化数据库（迁移 + 种子数据）==="
            fi

            # 拉取预构建镜像
            cd "$DEPLOY_DIR"
            echo "=== Pulling images from CNB registry ==="
            docker compose pull api-gateway admin-web

            # 重启服务
            echo "=== Stopping old containers ==="
            docker compose down || true

            echo "=== Starting monolith ==="
            docker compose up -d --no-build

            echo "=== Waiting for services ==="
            sleep 15
            docker compose ps
            docker compose logs --tail=20

            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Monolith deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
            JWT_SECRET: ${JWT_SECRET:-}

        - *health-check-monolith

# ============================================================
# Microservices 部署 (withoutai 分支)
# ============================================================

withoutai:
  push:
    - name: deploy-microservices
      <<: *deploy-base
      stages:
        - name: set-image-tag
          script: echo -n "${CNB_COMMIT_SHORT}"
          exports:
            info: IMAGE_TAG

        - *build-server
        - *build-admin-web
        - *push-images
        - *setup-ssh

        - name: deploy
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              CNB_BRANCH="$CNB_BRANCH" \
              IMAGE_TAG="$IMAGE_TAG" \
              DOMAIN="$DOMAIN" \
              JWT_SECRET="$JWT_SECRET" \
              CNB_REGISTRY_TOKEN="$CNB_REGISTRY_TOKEN" \
              'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            CONFIG_DIR="$DEPLOY_DIR/config"
            ENV_FILE="$CONFIG_DIR/.env.production"
            echo "=== Deploying microservices (tag: $IMAGE_TAG) ==="

            # 登录 CNB Registry
            echo "$CNB_REGISTRY_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin

            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard "origin/${CNB_BRANCH}" 2>/dev/null || git reset --hard "$CNB_BRANCH"

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},docker,config}

            # === 写入持久化配置 ===
            if [ ! -f "$ENV_FILE" ]; then
              echo "=== 首次部署，创建配置文件 ==="
              touch "$ENV_FILE"
            fi

            _set_if_missing() {
              local key="$1" value="$2"
              if ! grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                echo "${key}=${value}" >> "$ENV_FILE"
              fi
            }

            _set_if_missing DB_PASSWORD 'change_me'
            _set_if_missing REDIS_PASSWORD 'change_me'
            _set_if_missing JWT_SECRET "$(openssl rand -base64 48)"
            _set_if_missing JWT_EXPIRES_IN '7d'
            _set_if_missing ACCESS_TOKEN_EXPIRES_IN_SECONDS '7200'
            _set_if_missing CORS_ORIGINS "https://${DOMAIN},https://www.${DOMAIN},https://admin.${DOMAIN},https://api.${DOMAIN}"

            if [ -n "$JWT_SECRET" ] && [ "$JWT_SECRET" != 'change_me' ]; then
              sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${JWT_SECRET}/" "$ENV_FILE"
            fi

            # === 写入 docker-compose 使用的 .env.production ===
            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2-)"
              grep -v '^IMAGE_TAG=' "$ENV_FILE" | grep -v '^DOMAIN=' | grep -v '^DB_PASSWORD=' | grep -v '^REDIS_PASSWORD='
            } > "$DEPLOY_DIR/.env.production"

            # 同时写入 .env 供 Docker Compose 自动加载变量插值
            # --env-file 只影响容器的 env_file 指令，不提供 ${VAR} 插值
            # Docker Compose 自动读取工作目录下的 .env 文件用于变量插值
            cp "$DEPLOY_DIR/.env.production" "$DEPLOY_DIR/.env"

            # 检查数据库是否已初始化
            if [ -d "$DEPLOY_DIR/data/postgres" ] && [ "$(ls -A "$DEPLOY_DIR/data/postgres" 2>/dev/null)" ]; then
              echo "=== 数据库已存在，将执行迁移 ==="
            else
              echo "=== 首次部署，将初始化数据库（迁移 + 种子数据）==="
            fi

            # 拉取预构建镜像
            cd "$DEPLOY_DIR"
            echo "=== Pulling images from CNB registry ==="
            docker compose -f docker/docker-compose.production.yml pull

            echo "=== Stopping old containers ==="
            docker compose -f docker/docker-compose.production.yml down || true

            echo "=== Starting microservices ==="
            docker compose -f docker/docker-compose.production.yml up -d --no-build

            echo "=== Waiting for services ==="
            sleep 15
            docker compose -f docker/docker-compose.production.yml ps
            docker compose -f docker/docker-compose.production.yml logs --tail=20

            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Microservices deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
            JWT_SECRET: ${JWT_SECRET:-}

        - *health-check-microservices

