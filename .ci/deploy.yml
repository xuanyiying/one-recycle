# ============================================================
# 兜底分支：Tag 推送部署 + 手动触发部署
# ============================================================

$:
  tag_push:
    - name: deploy-by-tag
      <<: *deploy-base
      stages:
        - name: determine-mode
          script: |
            if [[ "$CNB_BRANCH" == *"-micro" ]]; then
              echo "##[set-output DEPLOY_MODE=microservices]"
            else
              echo "##[set-output DEPLOY_MODE=monolith]"
            fi
          exports:
            DEPLOY_MODE: DEPLOY_MODE
        - *deploy-setup-pnpm
        - *deploy-install
        - *deploy-lint
        - *deploy-typecheck
        - *deploy-start-services
        - *deploy-unit-tests
        - *deploy-setup-ssh
        - name: deploy-monolith
          if: '[ "$DEPLOY_MODE" = "monolith" ]'
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            echo "=== Deploying monolith (tag: $CNB_BRANCH) ==="

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout "$CNB_BRANCH"

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},config}

            MICROSERVICES_ENV="$DEPLOY_DIR/docker/.env.production"
            MONOLITH_ENV="$DEPLOY_DIR/.env.production"
