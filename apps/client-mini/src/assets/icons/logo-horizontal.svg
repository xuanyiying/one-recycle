<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 左侧图标部分 -->
  <g transform="translate(40, 40)">
    <!-- 回收符号背景圆 -->
    <circle cx="0" cy="0" r="28" fill="url(#iconGradient)" opacity="0.1"/>
    
    <!-- 回收箭头组 -->
    <g stroke="url(#iconGradient)" stroke-width="2" fill="url(#iconGradient)" stroke-linecap="round" stroke-linejoin="round">
      <!-- 第一个箭头（上方） -->
      <path d="M-8 -14 L0 -22 L8 -14 L6 -12 L3 -14 L3 -6 L-3 -6 L-3 -14 L-6 -12 Z" opacity="0.95"/>
      
      <!-- 第二个箭头（右下） -->
      <g transform="rotate(120)">
        <path d="M-8 -14 L0 -22 L8 -14 L6 -12 L3 -14 L3 -6 L-3 -6 L-3 -14 L-6 -12 Z" opacity="0.85"/>
      </g>
      
      <!-- 第三个箭头（左下） -->
      <g transform="rotate(240)">
        <path d="M-8 -14 L0 -22 L8 -14 L6 -12 L3 -14 L3 -6 L-3 -6 L-3 -14 L-6 -12 Z" opacity="0.75"/>
      </g>
    </g>
    
    <!-- 中心圆点 -->
    <circle cx="0" cy="0" r="3" fill="url(#iconGradient)"/>
    
    <!-- 装饰圆环 -->
    <circle cx="0" cy="0" r="18" stroke="url(#iconGradient)" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  
  <!-- 右侧文字部分 -->
  <g transform="translate(90, 40)">
    <!-- 主标题 -->
    <text x="0" y="-8" fill="url(#textGradient)" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2px">
      旧物回收
    </text>
    
    <!-- 副标题 -->
    <text x="0" y="12" fill="#666666" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1px" opacity="0.8">
      让闲置物品重获新生
    </text>
  </g>
  
  <!-- 装饰元素 -->
  <g opacity="0.1">
    <!-- 背景装饰圆点 -->
    <circle cx="200" cy="20" r="2" fill="url(#iconGradient)"/>
    <circle cx="220" cy="35" r="1.5" fill="url(#iconGradient)"/>
    <circle cx="210" cy="60" r="1" fill="url(#iconGradient)"/>
    
    <!-- 装饰线条 -->
    <path d="M190 25 Q200 30 210 25" stroke="url(#iconGradient)" stroke-width="1" fill="none"/>
    <path d="M195 50 Q205 55 215 50" stroke="url(#iconGradient)" stroke-width="1" fill="none"/>
  </g>
  
  <!-- 渐变定义 -->
  <defs>
    <!-- 图标渐变 -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00c896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a085;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文字渐变 -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00a085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>