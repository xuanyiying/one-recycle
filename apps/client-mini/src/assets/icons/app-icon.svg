<svg width="144" height="144" viewBox="0 0 144 144" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角矩形 -->
  <rect width="144" height="144" rx="28" fill="url(#gradient)"/>
  
  <!-- 主要回收符号 -->
  <g transform="translate(72, 72)">
    <!-- 外圆环 -->
    <circle cx="0" cy="0" r="36" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3"/>
    
    <!-- 回收箭头组 -->
    <g stroke="#ffffff" stroke-width="2.5" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <!-- 第一个箭头（上方） -->
      <path d="M-12 -20 L0 -32 L12 -20 L8 -16 L4 -20 L4 -8 L-4 -8 L-4 -20 L-8 -16 Z" opacity="0.95"/>
      
      <!-- 第二个箭头（右下） -->
      <g transform="rotate(120)">
        <path d="M-12 -20 L0 -32 L12 -20 L8 -16 L4 -20 L4 -8 L-4 -8 L-4 -20 L-8 -16 Z" opacity="0.85"/>
      </g>
      
      <!-- 第三个箭头（左下） -->
      <g transform="rotate(240)">
        <path d="M-12 -20 L0 -32 L12 -20 L8 -16 L4 -20 L4 -8 L-4 -8 L-4 -20 L-8 -16 Z" opacity="0.75"/>
      </g>
    </g>
    
    <!-- 中心圆点 -->
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    
    <!-- 内部装饰线条 -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.6">
      <circle cx="0" cy="0" r="18" fill="none"/>
      <circle cx="0" cy="0" r="26" fill="none"/>
    </g>
  </g>
  
  <!-- 底部品牌标识 -->
  <g transform="translate(72, 120)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" opacity="0.9">
      回收
    </text>
  </g>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#00c896;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a085;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 应用阴影 -->
  <style>
    rect {
      filter: url(#shadow);
    }
  </style>
</svg>