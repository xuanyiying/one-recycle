<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 主渐变 - 更亮的绿色 -->
    <linearGradient id="mainGradActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- AI 光芒渐变 - 更强 -->
    <radialGradient id="glowGradActive" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 麦克风渐变 -->
    <linearGradient id="micGradActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景光晕 - 更强 -->
  <circle cx="60" cy="60" r="58" fill="url(#glowGradActive)"/>
  
  <!-- 圆角方形容器 -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#mainGradActive)" filter="url(#glow)"/>
  
  <!-- 内部装饰框 - 更亮 -->
  <rect x="18" y="18" width="84" height="84" rx="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- AI 神经节点 - 左侧 - 更亮 -->
  <circle cx="38" cy="42" r="5" fill="#fff" filter="url(#glow)"/>
  <circle cx="30" cy="56" r="3.5" fill="#fff" opacity="0.85"/>
  <circle cx="44" cy="60" r="4" fill="#fff" opacity="0.9"/>
  
  <!-- 神经连接线 - 更亮 -->
  <line x1="38" y1="42" x2="30" y2="56" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <line x1="38" y1="42" x2="44" y2="60" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <line x1="30" y1="56" x2="44" y2="60" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  
  <!-- 麦克风主体 - 带发光 -->
  <g transform="translate(60, 58)">
    <!-- 麦克风头部 -->
    <rect x="-11" y="-22" width="22" height="30" rx="11" fill="url(#micGradActive)" filter="url(#glow)"/>
    
    <!-- 麦克风网格线 -->
    <line x1="-5" y1="-15" x2="-5" y2="0" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-15" x2="0" y2="0" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="5" y1="-15" x2="5" y2="0" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- 麦克风颈部 -->
    <path d="M-11 8 Q-11 18 0 18 Q11 18 11 8" fill="none" stroke="url(#micGradActive)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- 底座 -->
    <line x1="0" y1="18" x2="0" y2="24" stroke="url(#micGradActive)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-9" y1="24" x2="9" y2="24" stroke="url(#micGradActive)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  
  <!-- AI 闪电符号 - 右上角 - 更亮 -->
  <g transform="translate(84, 26)" filter="url(#glow)">
    <path d="M0 0 L7 9 L3.5 9 L5.5 18 L-2 8 L1 8 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.5"/>
  </g>
  
  <!-- 声波 - 麦克风两侧 - 更明显 -->
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M28 48 Q23 58 28 68"/>
    <path d="M22 44 Q15 58 22 72"/>
  </g>
  
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M92 48 Q97 58 92 68"/>
    <path d="M98 44 Q105 58 98 72"/>
  </g>
</svg>