name: Build and Deploy (Microservices)

on:
  push:
    branches: [prod, withoutai]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
      admin: ${{ steps.changes.outputs.admin }}
      nginx: ${{ steps.changes.outputs.nginx }}
      force: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || echo "")
          echo "Changed files: $CHANGED_FILES"

          echo "$CHANGED_FILES" | grep -qE '^(server/|deploy/docker/)' && echo "server=true" >> $GITHUB_OUTPUT || echo "server=false" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" | grep -qE '^apps/admin-web/' && echo "admin=true" >> $GITHUB_OUTPUT || echo "admin=false" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" | grep -qE '^deploy/nginx/' && echo "nginx=true" >> $GITHUB_OUTPUT || echo "nginx=false" >> $GITHUB_OUTPUT

  build-server:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-admin:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: [detect-changes, build-server, build-admin]
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          PROJECT_DIR="$HOME/one-recycle"

          echo "=== Server Info ==="
          echo "Docker: $(docker --version 2>/dev/null || echo 'not installed')"
          echo "Project: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          # Create .env from template if not exists
          if [ ! -f deploy/config/.env.production ]; then
            echo "WARNING: deploy/config/.env.production not found, creating from template..."
            if [ -f deploy/config/.env.production.example ]; then
              cp deploy/config/.env.production.example deploy/config/.env.production
              echo "Created .env.production from template. Please update with real values!"
            else
              echo "ERROR: deploy/config/.env.production.example not found"
              exit 1
            fi
          fi

          # Create .env file for docker compose with all required variables
          {
            echo "REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "DOMAIN=${{ secrets.DOMAIN }}"
            echo "EMAIL=${{ secrets.EMAIL }}"
            # Add all variables from .env.production
            cat deploy/config/.env.production
          } > deploy/docker/.env

          echo "=== Logging in to GHCR ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "=== Pulling images ==="
          docker compose -f deploy/docker/docker-compose.production.yml pull

          echo "=== Stopping old containers ==="
          docker compose -f deploy/docker/docker-compose.production.yml down || true

          echo "=== Starting services ==="
          docker compose -f deploy/docker/docker-compose.production.yml up -d

          echo "=== Container Status ==="
          docker compose -f deploy/docker/docker-compose.production.yml ps

          echo "=== Checking for errors ==="
          docker compose -f deploy/docker/docker-compose.production.yml logs --tail=50 | grep -i error || echo "No errors found"

          echo "=== Deployment completed ==="
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          DOMAIN="${{ secrets.DOMAIN }}"
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            if curl -sf --max-time 10 https://${DOMAIN}/health 2>/dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed, showing container status:"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker compose -f $HOME/one-recycle/deploy/docker/docker-compose.production.yml ps -a'
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker compose -f $HOME/one-recycle/deploy/docker/docker-compose.production.yml logs --tail=30'

          exit 1
