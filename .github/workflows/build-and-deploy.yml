name: Build and Deploy (Microservices)

on:
  push:
    branches: [prod, withoutai]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all services'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
      admin: ${{ steps.changes.outputs.admin }}
      nginx: ${{ steps.changes.outputs.nginx }}
      force_rebuild: ${{ github.event.inputs.force_rebuild || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        run: |
          FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
          
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "Force rebuild enabled, building all services"
            echo "server=true" >> $GITHUB_OUTPUT
            echo "admin=true" >> $GITHUB_OUTPUT
            echo "nginx=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check server changes
          if echo "$CHANGED_FILES" | grep -qE '^(server/|deploy/docker/)'; then
            echo "server=true" >> $GITHUB_OUTPUT
            echo "Server changes detected"
          else
            echo "server=false" >> $GITHUB_OUTPUT
          fi

          # Check admin-web changes
          if echo "$CHANGED_FILES" | grep -qE '^apps/admin-web/'; then
            echo "admin=true" >> $GITHUB_OUTPUT
            echo "Admin-web changes detected"
          else
            echo "admin=false" >> $GITHUB_OUTPUT
          fi

          # Check nginx changes
          if echo "$CHANGED_FILES" | grep -qE '^deploy/nginx/'; then
            echo "nginx=true" >> $GITHUB_OUTPUT
            echo "Nginx changes detected"
          else
            echo "nginx=false" >> $GITHUB_OUTPUT
          fi

  build-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.force_rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

  build-admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.force_rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

  deploy:
    needs: [detect-changes, build-server, build-admin]
    if: always() && (needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.nginx == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << SSHCONFIG
          Host deploy-server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 3
            TCPKeepAlive yes
          SSHCONFIG

      - name: Deploy microservices to server
        run: |
          SERVER_CHANGED="${{ needs.detect-changes.outputs.server }}"
          ADMIN_CHANGED="${{ needs.detect-changes.outputs.admin }}"
          NGINX_CHANGED="${{ needs.detect-changes.outputs.nginx }}"
          FORCE_REBUILD="${{ needs.detect-changes.outputs.force_rebuild }}"

          ssh deploy-server 'bash -s' << REMOTE_SCRIPT
          set -e
          cd ~/one-recycle

          echo "=== System Info ==="
          echo "Hostname: $(hostname)"
          echo "Docker version: $(docker --version)"
          echo "Force rebuild: $FORCE_REBUILD"

          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Clean old images if force rebuild
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "=== Force rebuild: Cleaning old images ==="
            docker images | grep '${{ env.IMAGE_NAME }}' | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            docker images | grep 'ghcr.io/${{ env.IMAGE_NAME }}' | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
          fi

          # Stop and remove old containers
          echo "=== Stopping old containers ==="
          docker compose -f deploy/docker/docker-compose.production.yml down 2>/dev/null || true

          # Check environment file
          if [ ! -f deploy/config/.env.production ]; then
            echo "ERROR: deploy/config/.env.production not found!"
            exit 1
          fi

          # Create .env file for docker compose
          cat > deploy/docker/.env << EOF
          REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG=${{ github.ref_name }}
          DOMAIN=${{ secrets.DOMAIN }}
          EMAIL=${{ secrets.EMAIL }}
          EOF
          cat deploy/config/.env.production >> deploy/docker/.env

          # Pull fresh images
          echo "=== Pulling images ==="
          docker compose -f deploy/docker/docker-compose.production.yml pull

          # Start all services fresh
          echo "=== Starting all services ==="
          docker compose -f deploy/docker/docker-compose.production.yml up -d

          # Wait and check
          sleep 30
          echo "=== Container Status ==="
          docker compose -f deploy/docker/docker-compose.production.yml ps -a

          # Show logs for failed containers
          FAILED=$(docker compose -f deploy/docker/docker-compose.production.yml ps -a --format '{{.Name}} {{.Status}}' | grep -v Up | awk '{print $1}')
          if [ -n "$FAILED" ]; then
            echo "=== Failed containers logs ==="
            for container in $FAILED; do
              echo "--- Logs for $container ---"
              docker logs --tail 50 $container 2>&1 || true
            done
          fi

          # Cleanup unused images
          docker system prune -af --volumes=false || true
          REMOTE_SCRIPT

      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/30 failed, waiting..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
