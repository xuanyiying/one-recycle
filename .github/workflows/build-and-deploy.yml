name: Build and Deploy (Microservices)

on:
  push:
    branches: [prod, withoutai]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COMPOSE_FILE: deploy/docker/docker-compose.production.yml
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push admin-web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: [build-server, build-admin]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/withoutai'
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << SSHCONFIG
          Host deploy-server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 3
            TCPKeepAlive yes
          SSHCONFIG

      - name: Deploy microservices to server
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          ENV_FILE: deploy/config/.env.production
        run: |
          # Sync code to server (exclude .env.production and .git)
          rsync -avz --delete --exclude='.git' --exclude='deploy/config/.env.production' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/one-recycle/
          
          # Execute deployment on server
          ssh deploy-server bash -se "
            set -e
            cd ~/one-recycle

            # Check if .env.production exists, create from template if not
            ENV_FILE=${ENV_FILE}
            if [ ! -f \"\${ENV_FILE}\" ]; then
              echo \"Creating \${ENV_FILE} from template...\"
              mkdir -p deploy/config
              cat > \${ENV_FILE} << 'ENVEOF'
# Database
DB_HOST=postgres
DB_PORT=5432
DB_USERNAME=one_recycle
DB_PASSWORD=OneRecycle2025Secure
DB_NAME=one_recycle

# Redis
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=OneRecycleRedis2025

# JWT (simple secret without special chars for template)
JWT_SECRET=OneRecycleJWT2025SecureRandomSecretKeyChangeMe

# App
NODE_ENV=production
LOG_LEVEL=info
ENVEOF
            fi

            # Load environment variables from .env.production
            set -a
            source \${ENV_FILE}
            set +a

            # Override with deployment-specific variables
            export DOMAIN=${DOMAIN}
            export EMAIL=${EMAIL}
            export REGISTRY=${REGISTRY}/${IMAGE_NAME}
            export IMAGE_TAG=${REF_NAME}
            export COMPOSE_FILE=${COMPOSE_FILE}

            echo 'Deploying from branch: ${REF_NAME}'
            echo 'Using compose file: ${COMPOSE_FILE}'
            echo 'Domain: ${DOMAIN}'
            echo 'DB_PASSWORD loaded: [${#DB_PASSWORD} chars]'
            echo 'REDIS_PASSWORD loaded: [${#REDIS_PASSWORD} chars]'

            # Login to GHCR
            echo '${GITHUB_TOKEN}' | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin

            # Stop and remove old containers first
            docker compose --env-file \${ENV_FILE} -f ${COMPOSE_FILE} down --remove-orphans || true

            # Pull new images for all microservices
            docker compose --env-file \${ENV_FILE} -f ${COMPOSE_FILE} pull

            # Restart services with zero downtime
            docker compose --env-file \${ENV_FILE} -f ${COMPOSE_FILE} up -d --remove-orphans

            # Show container status
            docker compose --env-file \${ENV_FILE} -f ${COMPOSE_FILE} ps -a

            # Show logs for debugging
            docker compose --env-file \${ENV_FILE} -f ${COMPOSE_FILE} logs --tail=20

            # Cleanup old images
            docker system prune -af --volumes=false || true
          "

      - name: Health Check
        run: |
          # Wait for services to be ready
          for i in {1..30}; do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/30 failed, waiting..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
