name: Build and Deploy (Microservices)

on:
  push:
    branches: [prod, withoutai]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: [build-server, build-admin]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/withoutai'
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << SSHCONFIG
          Host deploy-server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 3
            TCPKeepAlive yes
          SSHCONFIG

      - name: Deploy microservices to server
        run: |
          ssh deploy-server 'bash -s' << 'REMOTE_SCRIPT'
          set -e
          cd ~/one-recycle

          # Check environment file
          if [ ! -f deploy/config/.env.production ]; then
            echo "ERROR: deploy/config/.env.production not found!"
            exit 1
          fi

          echo "=== Deployment Info ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Image Tag: ${{ github.ref_name }}"

          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Create .env file for docker compose (combine all variables)
          cat > deploy/docker/.env << EOF
          REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG=${{ github.ref_name }}
          DOMAIN=${{ secrets.DOMAIN }}
          EMAIL=${{ secrets.EMAIL }}
          EOF

          # Append .env.production contents
          cat deploy/config/.env.production >> deploy/docker/.env

          echo "=== Docker Compose .env ==="
          cat deploy/docker/.env | grep -v PASSWORD | grep -v SECRET

          # Pull new images first
          docker compose -f deploy/docker/docker-compose.production.yml pull

          # Check if database services exist
          if docker ps -a --format '{{.Names}}' | grep -q 'one-recycle-postgres'; then
            echo "Database services exist, updating application services only..."
            docker compose -f deploy/docker/docker-compose.production.yml up -d --no-deps --force-recreate \
              api-gateway account-service order-service notification-service \
              inventory-service category-service admin-web nginx
          else
            echo "First deployment, starting all services..."
            docker compose -f deploy/docker/docker-compose.production.yml up -d
          fi

          # Wait and check
          sleep 20
          docker compose -f deploy/docker/docker-compose.production.yml ps -a

          # Cleanup
          docker system prune -af --volumes=false || true
          REMOTE_SCRIPT

      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/30 failed, waiting..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
