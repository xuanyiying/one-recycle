name: Build and Deploy (Microservices)

on:
  push:
    branches: [prod, withoutai]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================
  # CI: 代码质量检查
  # ============================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Lint
        run: pnpm run lint
        working-directory: server
      - name: Type check
        run: pnpm run typecheck
        working-directory: server
      - name: Unit tests
        run: pnpm run test:cov:unit
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

  # ============================
  # Build: 构建 Docker 镜像
  # ============================
  build-server:
    name: Build Server Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-admin:
    name: Build Admin Web Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================
  # Deploy: 部署到生产服务器
  # ============================
  deploy:
    name: Deploy to Production
    needs: [build-server, build-admin]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy microservices
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          PROJECT_DIR="$HOME/one-recycle"
          echo "=== Deploying microservices ==="
          echo "Docker: $(docker --version 2>/dev/null || echo 'not installed')"
          cd "$PROJECT_DIR"

          # Create .env file for docker compose
          {
            echo "REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "DOMAIN=${{ secrets.DOMAIN }}"
            echo "EMAIL=${{ secrets.EMAIL }}"
            # Merge production env config
            if [ -f deploy/config/.env.production ]; then
              cat deploy/config/.env.production
            fi
          } > deploy/docker/.env

          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

          # Pull latest images
          echo "=== Pulling images ==="
          docker compose -f deploy/docker/docker-compose.production.yml pull

          # Rolling restart: stop old containers and start new ones
          echo "=== Stopping old containers ==="
          docker compose -f deploy/docker/docker-compose.production.yml down || true

          echo "=== Starting microservices ==="
          docker compose -f deploy/docker/docker-compose.production.yml up -d

          # Wait for services to be healthy
          echo "=== Waiting for services ==="
          sleep 15

          # Check container status
          echo "=== Container Status ==="
          docker compose -f deploy/docker/docker-compose.production.yml ps

          # Check for errors
          echo "=== Recent Logs ==="
          docker compose -f deploy/docker/docker-compose.production.yml logs --tail=20

          echo "=== Deployment completed ==="
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          DOMAIN="${{ secrets.DOMAIN }}"
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            if curl -sf --max-time 10 https://${DOMAIN}/api/health 2>/dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed, checking server status:"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker compose -f $HOME/one-recycle/deploy/docker/docker-compose.production.yml ps -a'
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker compose -f $HOME/one-recycle/deploy/docker/docker-compose.production.yml logs --tail=30'
          exit 1

      - name: Notify deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed!"
          fi
