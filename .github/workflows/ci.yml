name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: install
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: lint
        working-directory: server
        run: pnpm run lint
      - name: typecheck
        working-directory: server
        run: pnpm run typecheck
      - name: unit-tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          DB_LOG_QUERIES: "true"
          LOG_LEVEL: debug
        run: |
          set -o pipefail
          pnpm run test:cov:unit 2>&1 | tee unit-test.log
      - name: e2e-tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          DB_LOG_QUERIES: "true"
          LOG_LEVEL: debug
        run: |
          set -o pipefail
          pnpm run test:cov:e2e 2>&1 | tee e2e-test.log
      - name: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-artifacts
          path: |
            server/coverage
            server/allure-results
            server/extent-report.html
            server/unit-test.log
            server/e2e-test.log
