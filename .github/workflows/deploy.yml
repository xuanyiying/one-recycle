name: Build and Deploy

on:
  push:
    branches: [prod, withoutai]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-micro'
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Deploy mode (monolith or microservices)'
        required: true
        default: 'monolith'
        type: choice
        options:
          - monolith
          - microservices

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  determine-mode:
    name: Determine Deploy Mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.set-mode.outputs.mode }}
    steps:
      - id: set-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.deploy_mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            if [[ "${{ github.ref_name }}" == *"-micro" ]]; then
              echo "mode=microservices" >> $GITHUB_OUTPUT
            else
              echo "mode=monolith" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref_name }}" = "refs/heads/withoutai" ] || [ "${{ github.ref_name }}" = "withoutai" ]; then
            echo "mode=microservices" >> $GITHUB_OUTPUT
          else
            echo "mode=monolith" >> $GITHUB_OUTPUT
          fi
          echo "Deploy mode: $(cat $GITHUB_OUTPUT | grep mode | cut -d'=' -f2)"

  lint-and-test:
    name: Lint & Test
    needs: determine-mode
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Lint
        run: pnpm run lint
        working-directory: server
      - name: Type check
        run: pnpm run typecheck
        working-directory: server
      - name: Unit tests
        run: pnpm run test:cov:unit
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

  build-server:
    name: Build Server Image
    needs: [determine-mode, lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-admin:
    name: Build Admin Web Image
    needs: [determine-mode, lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-monolith:
    name: Deploy (Monolith)
    needs: [determine-mode, build-server, build-admin]
    if: needs.determine-mode.outputs.mode == 'monolith'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy monolith
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          PROJECT_DIR="$HOME/one-recycle"
          echo "=== Deploying monolith ==="
          cd "$PROJECT_DIR"

          {
            echo "REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "DOMAIN=${{ secrets.DOMAIN }}"
            echo "EMAIL=${{ secrets.EMAIL }}"
            if [ -f deploy/config/.env.production ]; then
              cat deploy/config/.env.production
            fi
          } > deploy/.env

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

          echo "=== Pulling images ==="
          docker compose -f deploy/docker-compose.yml pull

          echo "=== Stopping old containers ==="
          docker compose -f deploy/docker-compose.yml down || true

          echo "=== Starting monolith ==="
          docker compose -f deploy/docker-compose.yml up -d

          echo "=== Waiting for services ==="
          sleep 15

          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --tail=20

          echo "=== Monolith deployment completed ==="
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          DOMAIN="${{ secrets.DOMAIN }}"
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            if curl -sf --max-time 10 https://${DOMAIN}/api/health 2>/dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker compose -f $HOME/one-recycle/deploy/docker-compose.yml ps -a'
          exit 1

  deploy-microservices:
    name: Deploy (Microservices)
    needs: [determine-mode, build-server, build-admin]
    if: needs.determine-mode.outputs.mode == 'microservices'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy microservices
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          PROJECT_DIR="$HOME/one-recycle"
          echo "=== Deploying microservices ==="
          cd "$PROJECT_DIR"

          {
            echo "REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "DOMAIN=${{ secrets.DOMAIN }}"
            echo "EMAIL=${{ secrets.EMAIL }}"
            if [ -f deploy/config/.env.production ]; then
              cat deploy/config/.env.production
            fi
          } > deploy/docker/.env

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

          echo "=== Pulling images ==="
          docker compose -f deploy/docker/docker-compose.production.yml pull

          echo "=== Stopping old containers ==="
          docker compose -f deploy/docker/docker-compose.production.yml down || true

          echo "=== Starting microservices ==="
          docker compose -f deploy/docker/docker-compose.production.yml up -d

          echo "=== Waiting for services ==="
          sleep 15

          docker compose -f deploy/docker/docker-compose.production.yml ps
          docker compose -f deploy/docker/docker-compose.production.yml logs --tail=20

          echo "=== Microservices deployment completed ==="
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          DOMAIN="${{ secrets.DEPLOY_HOST }}"
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            if curl -sf --max-time 10 https://${DOMAIN}/api/health 2>/dev/null; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker compose -f $HOME/one-recycle/deploy/docker/docker-compose.production.yml ps -a'
          exit 1
