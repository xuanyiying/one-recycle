# ============================================================================
# OneRecycle GitHub Actions CI/CD Pipeline
# 自动构建、测试并部署到腾讯云 CVM 服务器
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [prod]
    paths:
      - 'server/**'
      - 'apps/**'
      - 'deploy/**'
      - 'nginx/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [prod]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # Job 1: 代码质量检查
  # ==========================================================================
  lint-and-typecheck:
    name: 代码质量检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Run ESLint
        working-directory: ./server
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./server
        run: npm run typecheck

  # ==========================================================================
  # Job 2: 部署到腾讯云 CVM 服务器
  # ==========================================================================
  deploy:
    name: 部署到腾讯云
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          echo ">>> 开始部署 OneRecycle 到 ${SERVER_HOST}..."

          # 检查服务器上是否已有项目目录
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST << 'REMOTE_EOF'
            set -e

            APP_DIR="/opt/one-recycle"

            # 首次部署：初始化项目目录
            if [ ! -d "$APP_DIR" ]; then
              echo ">>> 首次部署，初始化项目目录..."
              mkdir -p $APP_DIR
              mkdir -p /opt/backups
            fi
          REMOTE_EOF

          # 部署文件到服务器
          echo ">>> 上传部署文件..."
          rsync -avz --delete \
            -e "ssh -p $SERVER_PORT" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='coverage' \
            --exclude='*.log' \
            --exclude='.next' \
            --exclude='dist' \
            ./server/ $SERVER_USER@$SERVER_HOST:$APP_DIR/server/

          rsync -avz --delete \
            -e "ssh -p $SERVER_PORT" \
            ./deploy/ $SERVER_USER@$SERVER_HOST:$APP_DIR/deploy/

          # 在服务器上执行部署
          echo ">>> 执行部署命令..."
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST << 'DEPLOY_EOF'
            set -e

            APP_DIR="/opt/one-recycle"
            COMPOSE_FILE="$APP_DIR/deploy/docker/docker-compose.production.yml"

            # 检查 Docker（兼容 TencentOS/CentOS/RHEL）
            if ! command -v docker &> /dev/null; then
              echo ">>> 安装 Docker..."
              # TencentOS 基于 CentOS，使用 yum 安装 Docker CE
              yum install -y yum-utils
              yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              yum install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              systemctl start docker
              systemctl enable docker
            fi

            echo ">>> 构建 Docker 镜像（首次可能需要 5-15 分钟）..."
            cd $APP_DIR/deploy/docker
            docker compose -f docker-compose.production.yml build --parallel

            echo ">>> 重启服务..."
            docker compose -f docker-compose.production.yml up -d

            # 清理旧镜像
            docker image prune -af --filter "until=168h" 2>/dev/null || true

            echo ">>> 部署完成！"
            docker compose -f docker-compose.production.yml ps
          DEPLOY_EOF

      - name: Health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo ">>> 健康检查..."
          sleep 20

          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              http://${SERVER_HOST}:3002/health 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo ">>> 健康检查通过 (HTTP 200)"
              exit 0
            fi

            echo ">>> 等待服务就绪... ($i/12, HTTP: $HTTP_STATUS)"
            sleep 5
          done

          echo ">>> 健康检查超时，但不阻塞部署"
          exit 0
