name: Deploy

on:
  push:
    branches: [prod, withoutai]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-micro'
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Deploy mode (monolith or microservices)'
        required: true
        default: 'monolith'
        type: choice
        options:
          - monolith
          - microservices

jobs:
  determine-mode:
    name: Determine Deploy Mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.set-mode.outputs.mode }}
    steps:
      - id: set-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.deploy_mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            if [[ "${{ github.ref_name }}" == *"-micro" ]]; then
              echo "mode=microservices" >> $GITHUB_OUTPUT
            else
              echo "mode=monolith" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref_name }}" = "refs/heads/withoutai" ] || [ "${{ github.ref_name }}" = "withoutai" ]; then
            echo "mode=microservices" >> $GITHUB_OUTPUT
          else
            echo "mode=monolith" >> $GITHUB_OUTPUT
          fi
          echo "Deploy mode: $(cat $GITHUB_OUTPUT | grep mode | cut -d'=' -f2)"

  lint-and-test:
    name: Lint & Test
    needs: determine-mode
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Lint
        run: pnpm run lint
        working-directory: server
      - name: Type check
        run: pnpm run typecheck
        working-directory: server
      - name: Unit tests
        run: pnpm run test:cov:unit
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

  deploy-monolith:
    name: Deploy (Monolith)
    needs: [determine-mode, lint-and-test]
    if: needs.determine-mode.outputs.mode == 'monolith'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deploy secrets
        run: |
          set -e
          missing=0
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error title=Missing secret::${name} is required for deployment"
              missing=1
            else
              echo "${name}: configured"
            fi
          }
          require_secret "DOMAIN" "${{ secrets.DOMAIN || 'backbuy.cn' }}"
          require_secret "DEPLOY_HOST" "${{ secrets.DEPLOY_HOST }}"
          require_secret "DEPLOY_USER" "${{ secrets.DEPLOY_USER }}"
          require_secret "DEPLOY_KEY" "${{ secrets.DEPLOY_KEY }}"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPath ~/.ssh/sockets/%r@%h-%p
            ControlPersist 600
          EOF
          mkdir -p ~/.ssh/sockets

      - name: Deploy monolith (git pull + build on server)
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          PROJECT_DIR="$HOME/one-recycle"
          DEPLOY_DIR="$PROJECT_DIR/deploy"
          echo "=== Deploying monolith (server-side build) ==="

          echo "=== Pulling latest code ==="
          cd "$PROJECT_DIR"
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

          echo "=== Ensuring directories exist ==="
          mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},config}

          echo "=== Writing .env.production for Docker Compose ==="
          {
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "DOMAIN=${{ secrets.DOMAIN || 'backbuy.cn' }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            if [ -f "$DEPLOY_DIR/.env.production" ]; then
              grep -v '^#' "$DEPLOY_DIR/.env.production" | grep -v '^$'
            fi
            if [ -f "$DEPLOY_DIR/config/.env.production" ]; then
              grep -v '^#' "$DEPLOY_DIR/config/.env.production" | grep -v '^$'
            fi
          } > "$DEPLOY_DIR/.env.production"

          echo "=== Deploy environment summary ==="
          grep -E '^(DOMAIN|IMAGE_TAG|DB_PASSWORD|REDIS_PASSWORD|JWT_SECRET)=' "$DEPLOY_DIR/.env.production" | sed 's/=.*/=<configured>/'

          echo "=== Building images on server ==="
          cd "$DEPLOY_DIR"
          docker compose build --parallel api-gateway admin-web

          echo "=== Stopping old containers ==="
          docker compose down || true

          echo "=== Starting monolith ==="
          docker compose up -d

          echo "=== Waiting for services ==="
          sleep 15

          docker compose ps
          docker compose logs --tail=20

          echo "=== Cleaning up old images ==="
          docker image prune -f

          echo "=== Monolith deployment completed ==="
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          DOMAIN="${{ secrets.DOMAIN || 'backbuy.cn' }}"
          APP_HEALTH_OK=0
          EXTERNAL_HEALTH_OK=0
          INTERNAL_HEALTH_OK=0
          CERT_HEALTH_OK=1

          check_cert_for_host() {
            local host="$1"
            echo "---- Certificate details for ${host} ----"
            local cert_output
            cert_output="$(echo | openssl s_client -connect "${host}:443" -servername "${host}" 2>/dev/null | openssl x509 -noout -issuer -subject -dates -ext subjectAltName 2>/dev/null || true)"

            if [ -z "$cert_output" ]; then
              echo "::warning title=Certificate probe failed::Could not read certificate details from ${host}:443"
              CERT_HEALTH_OK=0
              return
            fi

            echo "$cert_output"

            local compact_output
            compact_output="$(echo "$cert_output" | tr -d '[:space:]')"
            if ! echo "$compact_output" | grep -q "DNS:${host}"; then
              echo "::warning title=Certificate SAN mismatch::${host} is not present in the certificate SAN list"
              CERT_HEALTH_OK=0
            fi

            local issuer
            local subject
            issuer="$(echo "$cert_output" | grep '^issuer=' | head -n1 | cut -d= -f2-)"
            subject="$(echo "$cert_output" | grep '^subject=' | head -n1 | cut -d= -f2-)"
            if [ -n "$issuer" ] && [ -n "$subject" ] && [ "$issuer" = "$subject" ]; then
              echo "::warning title=Self-signed certificate detected::${host} appears to be serving a self-signed certificate"
              CERT_HEALTH_OK=0
            fi

            local not_after
            not_after="$(echo "$cert_output" | grep '^notAfter=' | head -n1 | cut -d= -f2-)"
            if [ -n "$not_after" ]; then
              local expiry_epoch
              expiry_epoch="$(date -d "$not_after" +%s 2>/dev/null || true)"
              local now_epoch
              now_epoch="$(date +%s)"
              if [ -n "$expiry_epoch" ]; then
                local days_left
                days_left="$(( (expiry_epoch - now_epoch) / 86400 ))"
                echo "Certificate expires in ${days_left} day(s)"
                if [ "$days_left" -lt 0 ]; then
                  echo "::warning title=Certificate expired::${host} certificate has already expired"
                  CERT_HEALTH_OK=0
                elif [ "$days_left" -lt 30 ]; then
                  echo "::warning title=Certificate expiring soon::${host} certificate will expire in ${days_left} day(s)"
                  CERT_HEALTH_OK=0
                fi
              fi
            fi
          }

          echo "=== Application health checks ==="
          for i in {1..10}; do
            echo "Application health attempt $i/10..."
            if curl -sf --max-time 10 "https://${DOMAIN}/api/health" >/dev/null 2>&1; then
              echo "Application health passed via primary HTTPS endpoint: https://${DOMAIN}/api/health"
              APP_HEALTH_OK=1
              EXTERNAL_HEALTH_OK=1
              break
            fi
            if ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "docker exec one-recycle-api-gateway curl -sf http://127.0.0.1:3002/api/health" >/dev/null 2>&1; then
              echo "Application health passed via Docker internal endpoint."
              echo "::warning title=External HTTPS not ready::Internal health passed, but external HTTPS validation has not succeeded yet"
              APP_HEALTH_OK=1
              INTERNAL_HEALTH_OK=1
              break
            fi
            sleep 10
          done

          echo "=== Application health summary ==="
          [ "$APP_HEALTH_OK" -eq 1 ] && echo "app_health=PASS" || echo "app_health=FAIL"
          [ "$EXTERNAL_HEALTH_OK" -eq 1 ] && echo "external_https_health=PASS" || echo "external_https_health=NOT_READY"
          [ "$INTERNAL_HEALTH_OK" -eq 1 ] && echo "internal_container_health=PASS" || echo "internal_container_health=NOT_USED"

          if [ "$APP_HEALTH_OK" -ne 1 ]; then
            echo "Application health failed, dumping container status and logs..."
            ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'ENDSSH'
            cd $HOME/one-recycle/deploy
            docker compose ps -a
            echo "=== Caddy logs ==="
            docker logs one-recycle-caddy --tail=30 2>/dev/null || true
            echo "=== Backend logs ==="
            docker logs one-recycle-api-gateway --tail=30 2>/dev/null || true
          ENDSSH
            exit 1
          fi

          echo "=== Certificate health checks ==="
          check_cert_for_host "${DOMAIN}"

          echo "=== Certificate health summary ==="
          [ "$CERT_HEALTH_OK" -eq 1 ] && echo "cert_health=PASS" || echo "cert_health=WARN"
          if [ "$CERT_HEALTH_OK" -ne 1 ]; then
            echo "::warning title=Certificate health degraded::Application is healthy but certificate checks reported issues"
          fi

  deploy-microservices:
    name: Deploy (Microservices)
    needs: [determine-mode, lint-and-test]
    if: needs.determine-mode.outputs.mode == 'microservices'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deploy secrets
        run: |
          set -e
          missing=0
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error title=Missing secret::${name} is required for deployment"
              missing=1
            else
              echo "${name}: configured"
            fi
          }
          require_secret "DOMAIN" "${{ secrets.DOMAIN || 'backbuy.cn' }}"
          require_secret "DEPLOY_HOST" "${{ secrets.DEPLOY_HOST }}"
          require_secret "DEPLOY_USER" "${{ secrets.DEPLOY_USER }}"
          require_secret "DEPLOY_KEY" "${{ secrets.DEPLOY_KEY }}"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPath ~/.ssh/sockets/%r@%h-%p
            ControlPersist 600
          EOF
          mkdir -p ~/.ssh/sockets

      - name: Deploy microservices (git pull + build on server)
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          PROJECT_DIR="$HOME/one-recycle"
          DEPLOY_DIR="$PROJECT_DIR/deploy"
          echo "=== Deploying microservices (server-side build) ==="

          echo "=== Pulling latest code ==="
          cd "$PROJECT_DIR"
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

          echo "=== Ensuring directories exist ==="
          mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},docker,config}

          echo "=== Writing .env.production for microservices ==="
          {
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "DOMAIN=${{ secrets.DOMAIN || 'backbuy.cn' }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$DEPLOY_DIR/.env.production" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
            echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$DEPLOY_DIR/.env.production" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
            if [ -f "$DEPLOY_DIR/config/.env.production" ]; then
              grep -v '^#' "$DEPLOY_DIR/config/.env.production" | grep -v '^$'
            fi
          } > "$DEPLOY_DIR/docker/.env.production"

          echo "=== Deploy environment summary ==="
          grep -E '^(DOMAIN|IMAGE_TAG|JWT_SECRET)=' "$DEPLOY_DIR/docker/.env.production" | sed 's/=.*/=<configured>/'
          grep -E '^(DB_PASSWORD|REDIS_PASSWORD)=' "$DEPLOY_DIR/docker/.env.production" | sed 's/=.*/=<configured>/'

          echo "=== Building images on server ==="
          cd "$DEPLOY_DIR"
          docker compose -f docker/docker-compose.production.yml build --parallel

          echo "=== Stopping old containers ==="
          docker compose -f docker/docker-compose.production.yml down || true

          echo "=== Starting microservices ==="
          docker compose -f docker/docker-compose.production.yml up -d

          echo "=== Waiting for services ==="
          sleep 15

          docker compose -f docker/docker-compose.production.yml ps
          docker compose -f docker/docker-compose.production.yml logs --tail=20

          echo "=== Cleaning up old images ==="
          docker image prune -f

          echo "=== Microservices deployment completed ==="
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          DOMAIN="${{ secrets.DOMAIN || 'backbuy.cn' }}"
          APP_HEALTH_OK=0
          EXTERNAL_HEALTH_OK=0
          INTERNAL_HEALTH_OK=0
          CERT_HEALTH_OK=1

          check_cert_for_host() {
            local host="$1"
            echo "---- Certificate details for ${host} ----"
            local cert_output
            cert_output="$(echo | openssl s_client -connect "${host}:443" -servername "${host}" 2>/dev/null | openssl x509 -noout -issuer -subject -dates -ext subjectAltName 2>/dev/null || true)"

            if [ -z "$cert_output" ]; then
              echo "::warning title=Certificate probe failed::Could not read certificate details from ${host}:443"
              CERT_HEALTH_OK=0
              return
            fi

            echo "$cert_output"

            local compact_output
            compact_output="$(echo "$cert_output" | tr -d '[:space:]')"
            if ! echo "$compact_output" | grep -q "DNS:${host}"; then
              echo "::warning title=Certificate SAN mismatch::${host} is not present in the certificate SAN list"
              CERT_HEALTH_OK=0
            fi

            local issuer
            local subject
            issuer="$(echo "$cert_output" | grep '^issuer=' | head -n1 | cut -d= -f2-)"
            subject="$(echo "$cert_output" | grep '^subject=' | head -n1 | cut -d= -f2-)"
            if [ -n "$issuer" ] && [ -n "$subject" ] && [ "$issuer" = "$subject" ]; then
              echo "::warning title=Self-signed certificate detected::${host} appears to be serving a self-signed certificate"
              CERT_HEALTH_OK=0
            fi

            local not_after
            not_after="$(echo "$cert_output" | grep '^notAfter=' | head -n1 | cut -d= -f2-)"
            if [ -n "$not_after" ]; then
              local expiry_epoch
              expiry_epoch="$(date -d "$not_after" +%s 2>/dev/null || true)"
              local now_epoch
              now_epoch="$(date +%s)"
              if [ -n "$expiry_epoch" ]; then
                local days_left
                days_left="$(( (expiry_epoch - now_epoch) / 86400 ))"
                echo "Certificate expires in ${days_left} day(s)"
                if [ "$days_left" -lt 0 ]; then
                  echo "::warning title=Certificate expired::${host} certificate has already expired"
                  CERT_HEALTH_OK=0
                elif [ "$days_left" -lt 30 ]; then
                  echo "::warning title=Certificate expiring soon::${host} certificate will expire in ${days_left} day(s)"
                  CERT_HEALTH_OK=0
                fi
              fi
            fi
          }

          echo "=== Application health checks ==="
          for i in {1..10}; do
            echo "Application health attempt $i/10..."
            if curl -sf --max-time 10 "https://${DOMAIN}/api/health" >/dev/null 2>&1; then
              echo "Application health passed via primary HTTPS endpoint: https://${DOMAIN}/api/health"
              APP_HEALTH_OK=1
              EXTERNAL_HEALTH_OK=1
              break
            fi
            if ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "docker exec one-recycle-api-gateway curl -sf http://127.0.0.1:3002/api/health" >/dev/null 2>&1; then
              echo "Application health passed via Docker internal endpoint."
              echo "::warning title=External HTTPS not ready::Internal health passed, but external HTTPS validation has not succeeded yet"
              APP_HEALTH_OK=1
              INTERNAL_HEALTH_OK=1
              break
            fi
            sleep 10
          done

          echo "=== Application health summary ==="
          [ "$APP_HEALTH_OK" -eq 1 ] && echo "app_health=PASS" || echo "app_health=FAIL"
          [ "$EXTERNAL_HEALTH_OK" -eq 1 ] && echo "external_https_health=PASS" || echo "external_https_health=NOT_READY"
          [ "$INTERNAL_HEALTH_OK" -eq 1 ] && echo "internal_container_health=PASS" || echo "internal_container_health=NOT_USED"

          if [ "$APP_HEALTH_OK" -ne 1 ]; then
            echo "Application health failed, dumping container status and logs..."
            ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'ENDSSH'
            cd $HOME/one-recycle/deploy
            docker compose -f docker/docker-compose.production.yml ps -a
            echo "=== Caddy logs ==="
            docker logs one-recycle-caddy --tail=30 2>/dev/null || true
            echo "=== API Gateway logs ==="
            docker logs one-recycle-api-gateway --tail=30 2>/dev/null || true
          ENDSSH
            exit 1
          fi

          echo "=== Certificate health checks ==="
          check_cert_for_host "${DOMAIN}"

          echo "=== Certificate health summary ==="
          [ "$CERT_HEALTH_OK" -eq 1 ] && echo "cert_health=PASS" || echo "cert_health=WARN"
          if [ "$CERT_HEALTH_OK" -ne 1 ]; then
            echo "::warning title=Certificate health degraded::Application is healthy but certificate checks reported issues"
          fi
