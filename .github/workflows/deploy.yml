# ============================================================================
# OneRecycle GitHub Actions CI/CD Pipeline
# 自动构建、测试并部署到腾讯云服务器
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Job 1: 代码质量检查
  # ==========================================================================
  lint-and-typecheck:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        working-directory: ./server
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./server
        run: npm run lint
      
      - name: Run TypeScript type check
        working-directory: ./server
        run: npm run typecheck

  # ==========================================================================
  # Job 2: 单元测试
  # ==========================================================================
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: one_recycle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        working-directory: ./server
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate
      
      - name: Run database migrations
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/one_recycle_test?schema=public
        run: npx prisma migrate deploy
      
      - name: Run unit tests with coverage
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/one_recycle_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline-only
        run: npm run test:cov:unit
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  # ==========================================================================
  # Job 3: 构建 Docker 镜像
  # ==========================================================================
  build-images:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - api-gateway
          - account-service
          - order-service
          - notification-service
          - inventory-service
          - category-service
          - message-queue
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}

  # ==========================================================================
  # Job 4: 部署到腾讯云服务器 (使用 SSH)
  # ==========================================================================
  deploy-to-tencent:
    name: 部署到腾讯云
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TENCENT_SSH_KEY }}
          log-public-key: false
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.TENCENT_SSH_PORT || '22' }} ${{ secrets.TENCENT_SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.TENCENT_SERVER_IP }}
          SERVER_USER: ${{ secrets.TENCENT_SSH_USER || 'ubuntu' }}
          SERVER_PORT: ${{ secrets.TENCENT_SSH_PORT || '22' }}
          DEPLOY_DIR: /opt/one-recycle
        run: |
          echo "🚀 开始部署到腾讯云服务器..."
          
          # 创建部署包
          echo "📦 准备部署包..."
          tar czvf deploy-package.tar.gz \
            server/dist \
            server/prisma \
            server/package.json \
            server/pnpm-lock.yaml \
            deploy/ \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.log'
          
          # 上传并部署
          echo "📤 上传部署包..."
          scp -P $SERVER_PORT deploy-package.tar.gz $SERVER_USER@$SERVER_IP:/tmp/
          
          echo "🔧 执行部署..."
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            cd /opt/one-recycle
            
            # 备份当前版本
            echo "💾 备份当前版本..."
            sudo mkdir -p /opt/backups
            BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
            sudo tar czf /opt/backups/backup_$BACKUP_DATE.tar.gz . --exclude='node_modules' --exclude='dist' 2>/dev/null || true
            
            # 清理旧备份 (保留最近10个)
            sudo ls -t /opt/backups/backup_*.tar.gz 2>/dev/null | tail -n +11 | xargs -r sudo rm -f
            
            # 解压新代码
            echo "📂 解压新代码..."
            sudo tar xzf /tmp/deploy-package.tar.gz --overwrite
            sudo rm -f /tmp/deploy-package.tar.gz
            
            # 更新镜像
            echo "🐳 更新 Docker 镜像..."
            sudo docker-compose -f deploy/docker/docker-compose.production.yml pull || true
            
            # 重启服务
            echo "🔄 重启服务..."
            sudo docker-compose -f deploy/docker/docker-compose.production.yml up -d --build
            
            # 执行数据库迁移
            echo "🗄️ 执行数据库迁移..."
            sleep 10
            sudo docker exec one-recycle-api-gateway npx prisma migrate deploy || echo "迁移可能已是最新"
            
            # 清理旧镜像
            echo "🧹 清理旧镜像..."
            sudo docker image prune -af --filter "until=168h" || true
            
            echo "✅ 部署完成!"
          EOF
          
          rm -f deploy-package.tar.gz
      
      - name: Health check
        env:
          SERVER_IP: ${{ secrets.TENCENT_SERVER_IP }}
        run: |
          echo "🏥 执行健康检查..."
          sleep 15
          
          # 等待服务就绪
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SERVER_IP:3002/health || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ 健康检查通过 (HTTP 200)"
              exit 0
            fi
            echo "⏳ 等待服务就绪... ($i/10)"
            sleep 5
          done
          
          echo "❌ 健康检查失败"
          exit 1
      
      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            ${{ job.status == 'success' && '✅ 部署成功!' || '❌ 部署失败!' }}
            项目: OneRecycle
            环境: Production
            服务器: ${{ secrets.TENCENT_SERVER_IP }}
            提交: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ==========================================================================
  # Job 5: E2E 测试 (可选)
  # ==========================================================================
  e2e-tests:
    name: E2E 测试
    runs-on: ubuntu-latest
    needs: deploy-to-tencent
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        working-directory: ./server
        run: npm ci
      
      - name: Run E2E tests
        working-directory: ./server
        env:
          API_BASE_URL: http://${{ secrets.TENCENT_SERVER_IP }}:3002
        run: |
          echo "🧪 运行 E2E 测试..."
          # npm run test:e2e || echo "E2E 测试失败，但不阻塞部署"
          echo "E2E 测试跳过 (需要配置测试环境)"

  # ==========================================================================
  # Job 6: 构建前端 (Admin Web)
  # ==========================================================================
  build-admin-web:
    name: 构建管理后台
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json
      
      - name: Install dependencies
        working-directory: ./apps/admin-web
        run: npm ci
      
      - name: Build
        working-directory: ./apps/admin-web
        env:
          NEXT_PUBLIC_API_URL: https://api.backbuy.cn
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-build
          path: apps/admin-web/.next/
          retention-days: 7
