# ============================================================
# 部署流水线
# 对应 deploy.yml 中的 prod/withoutai 分支推送
# ============================================================

prod:
  push:
    - name: deploy-monolith
      runner:
        cpus: 2
      docker:
        image: node:22
        volumes:
          - server_deps:/workspace/server/node_modules:rw
      services:
        - docker
      imports:
        - ./secrets.yml
      lock:
        key: deploy-lock
        wait: true
      stages:
        - name: setup-pnpm
          script: |
            corepack enable
            corepack prepare pnpm@9 --activate
        - name: install
          script: cd server && pnpm install --frozen-lockfile
        - name: lint
          script: cd server && pnpm run lint
        - name: typecheck
          script: cd server && pnpm run typecheck
        - name: start-services
          script: |
            docker run -d --name postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=test_db \
              -p 5432:5432 \
              postgres:15
            docker run -d --name redis \
              -p 6379:6379 \
              redis:7
            for i in $(seq 1 30); do
              docker exec postgres pg_isready -U postgres >/dev/null 2>&1 && break
              sleep 1
            done
        - name: unit-tests
          script: cd server && pnpm run test:cov:unit
          env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
            REDIS_URL: redis://localhost:6379
        - name: setup-ssh
          script: |
            mkdir -p ~/.ssh
            echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        - name: deploy
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            echo "=== Deploying monolith (server-side build) ==="

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout $CNB_BRANCH
            git pull origin $CNB_BRANCH

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},config}

            echo "=== Writing .env ==="
            MICROSERVICES_ENV="$DEPLOY_DIR/docker/.env.production"
            MONOLITH_ENV="$DEPLOY_DIR/.env.production"
            {
              echo "IMAGE_TAG=$CNB_BRANCH"
              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$MICROSERVICES_ENV" 2>/dev/null | cut -d'=' -f2- || grep '^DB_PASSWORD=' "$MONOLITH_ENV" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$MICROSERVICES_ENV" 2>/dev/null | cut -d'=' -f2- || grep '^REDIS_PASSWORD=' "$MONOLITH_ENV" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
              if [ -f "$DEPLOY_DIR/config/.env.production" ]; then
                cat "$DEPLOY_DIR/config/.env.production"
              fi
            } > "$MICROSERVICES_ENV"

            echo "=== Building images on server ==="
            cd "$DEPLOY_DIR"
            docker compose build --parallel api-gateway admin-web

            echo "=== Stopping old containers ==="
            docker compose down || true

            echo "=== Starting monolith ==="
            docker compose up -d

            echo "=== Waiting for services ==="
            sleep 15
            docker compose ps
            docker compose logs --tail=20

            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Monolith deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
        - name: health-check
          script: |
            sleep 30
            DOMAIN="${DOMAIN:-backbuy.cn}"
            for i in $(seq 1 10); do
              echo "Health check attempt $i/10..."
              if curl -sf --max-time 10 "https://${DOMAIN}/api/health" >/dev/null 2>&1; then
                echo "Application health passed: https://${DOMAIN}/api/health"
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed"
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'ENDSSH'
            cd $HOME/one-recycle/deploy
            docker compose ps -a
            echo "=== Caddy logs ==="
            docker logs one-recycle-caddy --tail=30 2>/dev/null || true
            echo "=== Backend logs ==="
            docker logs one-recycle-api-gateway --tail=30 2>/dev/null || true
            ENDSSH
            exit 1
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}

