              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$MICROSERVICES_ENV" 2>/dev/null | cut -d'=' -f2- || grep '^DB_PASSWORD=' "$MONOLITH_ENV" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$MICROSERVICES_ENV" 2>/dev/null | cut -d'=' -f2- || grep '^REDIS_PASSWORD=' "$MONOLITH_ENV" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
              if [ -f "$DEPLOY_DIR/config/.env.production" ]; then
                cat "$DEPLOY_DIR/config/.env.production"
              fi
            } > "$MICROSERVICES_ENV"

            cd "$DEPLOY_DIR"
            docker compose build --parallel api-gateway admin-web
            docker compose down || true
            docker compose up -d
            sleep 15
            docker compose ps
            docker image prune -f
            echo "=== Monolith deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
        - name: deploy-microservices
          if: '[ "$DEPLOY_MODE" = "microservices" ]'
          script: |
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' << 'ENDSSH'
            set -e
            PROJECT_DIR="$HOME/one-recycle"
            DEPLOY_DIR="$PROJECT_DIR/deploy"
            echo "=== Deploying microservices (manual trigger) ==="

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout $CNB_BRANCH
            git pull origin $CNB_BRANCH

            mkdir -p "$DEPLOY_DIR"/{caddy,www/html,data/{postgres,redis},docker,config}

            {
              echo "IMAGE_TAG=$CNB_BRANCH"
              echo "DOMAIN=$DOMAIN"
              echo "DB_PASSWORD=$(grep '^DB_PASSWORD=' "$DEPLOY_DIR/.env.production" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
              echo "REDIS_PASSWORD=$(grep '^REDIS_PASSWORD=' "$DEPLOY_DIR/.env.production" 2>/dev/null | cut -d'=' -f2- || echo 'change_me')"
              if [ -f "$DEPLOY_DIR/config/.env.production" ]; then
                cat "$DEPLOY_DIR/config/.env.production"
              fi
            } > "$DEPLOY_DIR/.env.production"

            cd "$DEPLOY_DIR"
            docker compose -f docker/docker-compose.production.yml build --parallel
            docker compose -f docker/docker-compose.production.yml down || true
            docker compose -f docker/docker-compose.production.yml up -d
            sleep 15
            docker compose -f docker/docker-compose.production.yml ps
            docker image prune -f
            echo "=== Microservices deployment completed ==="
            ENDSSH
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
        - name: health-check
          script: |
            sleep 30
            DOMAIN="${DOMAIN:-backbuy.cn}"
            for i in $(seq 1 10); do
              echo "Health check attempt $i/10..."
              if curl -sf --max-time 10 "https://${DOMAIN}/api/health" >/dev/null 2>&1; then
                echo "Health check passed: https://${DOMAIN}/api/health"
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed"
            exit 1
          env:
            DOMAIN: ${DOMAIN:-backbuy.cn}
