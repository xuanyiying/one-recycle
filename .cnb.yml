# ============================================================
# 兜底分支：Tag 推送部署 + 手动触发部署
# 对应 deploy.yml 中的 tag_push 和 workflow_dispatch
# ============================================================

$:
  tag_push:
    - name: deploy-by-tag
      runner:
        cpus: 2
      docker:
        image: node:22
        volumes:
          - server_deps:/workspace/server/node_modules:rw
      services:
        - docker
      imports:
        - ./secrets.yml
      lock:
        key: deploy-lock
        wait: true
      stages:
        - name: determine-mode
          script: |
            if [[ "$CNB_BRANCH" == *"-micro" ]]; then
              echo "##[set-output DEPLOY_MODE=microservices]"
            else
              echo "##[set-output DEPLOY_MODE=monolith]"
            fi
          exports:
            DEPLOY_MODE: DEPLOY_MODE
        - name: setup-pnpm
          script: |
            corepack enable
            corepack prepare pnpm@9 --activate
        - name: install
          script: cd server && pnpm install --frozen-lockfile
        - name: lint
          script: cd server && pnpm run lint
        - name: typecheck
          script: cd server && pnpm run typecheck
        - name: start-services
